    ctx.fillStyle = lineColor;
    ctx.fill();
    
    // Draw chevron label based on showConnectionLabels setting
    const shouldShowLabel = formattingSettings.showConnectionLabels === 'always' 
      || (formattingSettings.showConnectionLabels === 'hover' && (isSelected || isHovered || isHighlighted));
    if (shouldShowLabel) {
      // Build chevron text: Note + formatted Value
      let chevronText = l.note || '';
      if (l.connectionValue != null && !isNaN(l.connectionValue)) {
        const fmtVal = formatValue(l.connectionValue, formattingSettings.connectionValuePrefix);
        if (chevronText) {
          chevronText += ' ' + fmtVal;
        } else {
          chevronText = fmtVal;
        }
      }
      if (chevronText) {
        ctx.globalAlpha = 1.0;
        drawChevronLabel(l.source.x, l.source.y, l.target.x, l.target.y, chevronText, lineColor);
      }
    }
    
    ctx.restore();
  }

  // Compute min/max connection values for line scaling (cached)
  let _lineSizeRange = null;
  function getLineSizeRange() {
    if (_lineSizeRange) return _lineSizeRange;
    const values = links.filter(l => l.connectionValue != null && !isNaN(l.connectionValue)).map(l => l.connectionValue);
    if (values.length === 0) return { min: 0, max: 1 };
    _lineSizeRange = { min: Math.min(...values), max: Math.max(...values) };
    return _lineSizeRange;
  }

  function getScaledLineThickness(value) {
    const range = getLineSizeRange();
    if (range.max === range.min) return 11; // midpoint
    const normalized = (value - range.min) / (range.max - range.min);
    return 2 + normalized * (20 - 2);
  }

  function drawNode(n, opacity, showImage=true) {
    ctx.save();
    const x = n.x, y = n.y;
    
    // No conditional formatting — use defaults only
    const isHovered = (hoveredNode && n === hoveredNode) ||
                      (hoveredConnection && (n.id === hoveredConnection.source || n.id === hoveredConnection.target));
    const isSelected = selectedNode && n === selectedNode;
    
    // Check if this node is connected to the hovered node
    const isConnectedToHovered = hoveredNode && hoveredNode !== n && 
                                  adjacency.get(hoveredNode.id)?.has(n.id);
    
    // Check if this node should be highlighted in the current view (Story Mode)
    let isHighlightedInView = false;
    if (isStoryMode && sortedViewIds.length > 0) {
      const currentViewId = sortedViewIds[currentViewIndex];
      const highlightViews = entityHighlightsMap.get(n.id);
      isHighlightedInView = highlightViews && highlightViews.has(currentViewId);
    }
    
    // Get node shape from Shape Legend Category
    const shape = getNodeShape(n);
    
    // Use default formatting colors, with Color Legend Category on OUTLINE
    const nodeCats = getNodeCategories(n);
    const catColor = nodeCats.length > 0 ? categoryColorMap.get(nodeCats[0]) : null;
    const baseNodeColor = formattingSettings.nodeColor;
    const nodeColor = isHovered ? formattingSettings.nodeHoverColor : baseNodeColor;
    const baseOutlineColor = catColor || formattingSettings.outlineColor;
    const outlineColor = (isHovered || isSelected || isConnectedToHovered || isHighlightedInView) ? formattingSettings.outlineHoverColor : baseOutlineColor;
    const baseOutlineThickness = (isHovered || isSelected || isConnectedToHovered || isHighlightedInView) ? (formattingSettings.outlineThickness + 1) : formattingSettings.outlineThickness;
    
    // Scale outline thickness with the UI scale factor
    const outlineThickness = baseOutlineThickness * uiScale;
    
    // Node radius already includes scale factor from computeGridLayout
    const r = n.r;

    if (showImage && n.imageBitmap) {
      ctx.save();
      ctx.globalAlpha = opacity;
      ctx.beginPath();
      // Clip to shape
      drawShapePath(ctx, shape, x, y, r);
      ctx.clip();
      const img = n.imageBitmap;
      const iw = img.width || img.naturalWidth || 1;
      const ih = img.height || img.naturalHeight || 1;
      const target = r * 2;
      const scale = Math.max(target / iw, target / ih);
      const dw = iw * scale;
      const dh = ih * scale;
      const dx = x - dw / 2;
      const dy = y - dh / 2;
      try {
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, dx, dy, dw, dh);
      } catch (e) {
        drawShapePath(ctx, shape, x, y, r);
        ctx.fillStyle = nodeColor;
        ctx.fill();
      }
      ctx.restore();
    } else {
      ctx.save();
      ctx.globalAlpha = opacity;
      drawShapePath(ctx, shape, x, y, r);
      ctx.fillStyle = nodeColor;
      ctx.fill();
      ctx.restore();
    }

    // Draw outline with glow if this is the selected node
    ctx.save();
    ctx.globalAlpha = opacity;
    
    // Add pulsing glow for selected node
    if (selectedNode && n === selectedNode) {
      const pulsePhase = Math.sin(animationTime * 0.002) * 0.5 + 0.5; // Oscillates between 0 and 1
      const glowSize = (5 + pulsePhase * 10) * uiScale; // Scale glow with UI
      const glowAlpha = 0.5 + pulsePhase * 0.5; // Varies between 0.5 and 1
      
      // Convert hover outline color to rgba for glow effect
      const hoverColor = formattingSettings.outlineHoverColor;
      const rr = parseInt(hoverColor.slice(1, 3), 16);
      const gg = parseInt(hoverColor.slice(3, 5), 16);
      const bb = parseInt(hoverColor.slice(5, 7), 16);
      
      ctx.shadowColor = `rgba(${rr}, ${gg}, ${bb}, ${glowAlpha})`;
      ctx.shadowBlur = glowSize;
    }
    
    drawShapePath(ctx, shape, x, y, r);
    ctx.lineWidth = outlineThickness / zoomLevel;
    ctx.strokeStyle = outlineColor;
    ctx.stroke();
    ctx.restore();

    ctx.restore();
  }

  function drawLabel(n) {
    const text = n.name || '';
    if (!text) return;
    const labelFontSize = Number(formattingSettings.nodeLabelSize) || CONFIG.labelFontSize;
    ctx.save();
    ctx.font = `${labelFontSize / zoomLevel}px Rubik, Arial, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const metrics = ctx.measureText(text);
    const textW = metrics.width;
    const pad = CONFIG.labelBoxPadding / zoomLevel;
    const boxW = textW + pad * 2;
    const boxH = (labelFontSize + 6) / zoomLevel;
    const x = n.x - boxW / 2;
    const y = n.y + n.r + CONFIG.labelOffsetY / zoomLevel;

    ctx.save();
    ctx.globalAlpha = CONFIG.labelBoxOpacity;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    roundRectPath(x, y, boxW, boxH, 6 / zoomLevel);
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = '#111827';
    ctx.fillText(text, n.x, y + boxH / 2);
    ctx.restore();
  }

  function shouldHighlightNode(node) {
    // In story mode, nodes not in current view should be unhighlighted (low opacity)
    if (isStoryMode && sortedViewIds.length > 0) {
      const currentViewId = sortedViewIds[currentViewIndex];
      const currentViewEntities = new Set(viewEntitiesCache.get(currentViewId) || []);
      if (!currentViewEntities.has(node.id)) {
        return false; // Not in current view, show with low opacity
      }
    }
    
    if (!selectedNode) return true;
    const activeSet = new Set([selectedNode.id, ...(adjacency.get(selectedNode.id) || [])]);
    return activeSet.has(node.id);
  }


  /************************************************************************
   * LEGEND FUNCTIONS
   ************************************************************************/
  // Function to extract unique categories and assign colors
  // Helper: get color legend category for a node (single value, not comma-separated)
  function getNodeCategories(node) {
    if (!node.raw || !node.raw['Color Legend Category']) return [];
    const cat = node.raw['Color Legend Category'].trim();
    return cat ? [cat] : [];
  }

  // Helper: get shape legend category for a node
  function getNodeShapeCategory(node) {
    if (!node.raw || !node.raw['Shape Legend Category']) return '';
    return node.raw['Shape Legend Category'].trim();
  }

  function updateCategoryColors() {
    // Build color map from colorLegendEntries (from Options CSV)
    categoryColorMap.clear();
    const enabledEntries = colorLegendEntries.filter(e => e.enabled && e.label && e.color);
    enabledEntries.forEach(e => {
      categoryColorMap.set(e.label, e.color);
    });
    
    // Collect unique categories from nodes, maintaining CSV legend order
    const categories = new Set();
    nodes.forEach(node => {
      getNodeCategories(node).forEach(cat => categories.add(cat));
    });
    
    // Order categories according to colorLegendEntries order
    const legendLabelOrder = colorLegendEntries.filter(e => e.enabled && e.label).map(e => e.label);
    uniqueCategories = [];
    legendLabelOrder.forEach(label => {
      if (categories.has(label)) uniqueCategories.push(label);
    });
    // Append any categories not in the legend entries at the end
    categories.forEach(cat => {
      if (!uniqueCategories.includes(cat)) uniqueCategories.push(cat);
    });
    
    // Only keep categories that have a color mapping in the legend
    // (nodes without a matching category get default color)
    
    // Add all categories as active by default
    uniqueCategories.forEach(cat => {
      if (!activeCategories.has(cat)) {
        activeCategories.add(cat);
      }
    });
    
    // Remove categories that no longer exist
    const currentCategories = new Set(uniqueCategories);
    Array.from(activeCategories).forEach(cat => {
      if (!currentCategories.has(cat)) {
        activeCategories.delete(cat);
      }
    });
    
    // Build shape categories
    const shapeCats = new Set();
    nodes.forEach(node => {
      const sc = getNodeShapeCategory(node);
      if (sc) shapeCats.add(sc);
    });
    uniqueShapeCategories = Array.from(shapeCats);
    // Maintain order from shapeLegendEntries
    const shapeLabelOrder = shapeLegendEntries.filter(e => e.enabled && e.label).map(e => e.label);
    uniqueShapeCategories.sort((a, b) => {
      const ia = shapeLabelOrder.indexOf(a);
      const ib = shapeLabelOrder.indexOf(b);
      return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
    });
    uniqueShapeCategories.forEach(cat => {
      if (!activeShapeCategories.has(cat)) activeShapeCategories.add(cat);
    });
    const currentShapeCats = new Set(uniqueShapeCategories);
    Array.from(activeShapeCategories).forEach(cat => {
      if (!currentShapeCats.has(cat)) activeShapeCategories.delete(cat);
    });
  }

  // Function to update legend display
  function updateLegend() {
    if (!legendContainer) return;
    
    // Only show legend if there are enabled color legend entries with matching categories
    const legendCategories = uniqueCategories.filter(cat => categoryColorMap.has(cat));
    
    if (legendCategories.length === 0) {
      legendContainer.style.display = 'none';
      return;
    }
    
    legendContainer.style.display = 'flex';
    legendContainer.innerHTML = '';
    
    legendCategories.forEach(category => {
      const item = document.createElement('div');
      item.className = 'legend-item';
      if (colorFilterActive && !activeCategories.has(category)) {
        item.classList.add('inactive');
      }
      
      const colorBox = document.createElement('div');
      colorBox.className = 'legend-color-box';
      colorBox.style.backgroundColor = categoryColorMap.get(category);
      
      const label = document.createElement('span');
      label.textContent = category;
      
      item.appendChild(colorBox);
      item.appendChild(label);
      
      item.addEventListener('click', () => {
        const isOnlyActive = colorFilterActive && activeCategories.size === 1 && activeCategories.has(category);

        if (isOnlyActive) {
          activeCategories.clear();
          uniqueCategories.forEach(cat => activeCategories.add(cat));
          colorFilterActive = false;
        } else {
          activeCategories.clear();
          activeCategories.add(category);
          colorFilterActive = true;
        }

        updateLegend();
        render();
      });
      
      legendContainer.appendChild(item);
    });
    
    legendContainer.style.display = 'flex';
    legendContainer.style.visibility = 'visible';
    legendContainer.style.opacity = '1';
  }

  /************************************************************************
   * SHAPE DRAWING HELPERS
   ************************************************************************/
  function drawShapePath(ctx, shape, x, y, r) {
    switch (shape) {
      case 'square':
        ctx.beginPath();
        ctx.rect(x - r, y - r, r * 2, r * 2);
        break;
      case 'triangle':
        ctx.beginPath();
        ctx.moveTo(x, y - r * 1.15);
        ctx.lineTo(x + r * 1.05, y + r * 0.75);
        ctx.lineTo(x - r * 1.05, y + r * 0.75);
        ctx.closePath();
        break;
      case 'diamond':
        ctx.beginPath();
        ctx.moveTo(x, y - r * 1.15);
        ctx.lineTo(x + r * 1.0, y);
        ctx.lineTo(x, y + r * 1.15);
        ctx.lineTo(x - r * 1.0, y);
        ctx.closePath();
        break;
      case 'circle':
      default:
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        break;
    }
  }

  function getNodeShape(node) {
    // Check Shape Legend Category
    const shapeCat = getNodeShapeCategory(node);
    if (shapeCat && shapeCategoryMap.has(shapeCat)) {
      return shapeCategoryMap.get(shapeCat);
    }
    return formattingSettings.nodeShape || 'circle';
  }

  /************************************************************************
   * SHAPE LEGEND
   ************************************************************************/
  const SHAPE_ICONS = { circle: '〇', square: '▢', triangle: '△', diamond: '◇' };

  function updateShapeLegend() {
    if (!shapeLegendContainer) return;

    const activeItems = shapeLegendEntries.filter(e => e.enabled && e.label.trim());
    if (activeItems.length === 0) {
      shapeLegendContainer.style.display = 'none';
      return;
    }

    shapeLegendContainer.style.display = 'flex';
    shapeLegendContainer.innerHTML = '';

    activeItems.forEach(entry => {
      const item = document.createElement('div');
      item.className = 'shape-legend-item';
      item.style.cursor = 'pointer';
      item.style.transition = 'all 0.2s';
      
      // Dim if this shape category is filtered out
      if (!activeShapeCategories.has(entry.label)) {
        item.style.opacity = '0.4';
      }

      const icon = document.createElement('span');
      icon.className = 'shape-legend-icon';
      icon.textContent = SHAPE_ICONS[entry.shape] || '〇';

      const label = document.createElement('span');
      label.textContent = entry.label;

      item.appendChild(icon);
      item.appendChild(label);
      
      item.addEventListener('click', () => {
        const isOnlyActive = activeShapeCategories.size === 1 && activeShapeCategories.has(entry.label);
        if (isOnlyActive) {
          activeShapeCategories.clear();
          uniqueShapeCategories.forEach(cat => activeShapeCategories.add(cat));
        } else {
          activeShapeCategories.clear();
          activeShapeCategories.add(entry.label);
        }
        updateShapeLegend();
        render();
      });
      
      shapeLegendContainer.appendChild(item);
    });
  }

  /************************************************************************
   * RENDER
   ************************************************************************/
  function drawGridOverlay() {
    const half = CONFIG.gridUnits / 2; // 30
    ctx.save();
    ctx.lineWidth = 1 / zoomLevel;
    for (let i = -half; i <= half; i++) {
      const isAxis = (i === 0);
      const isMajor = (i % 5 === 0);
      ctx.strokeStyle = isAxis ? 'rgba(0,0,0,0.32)'
        : isMajor ? 'rgba(0,0,0,0.16)'
        : 'rgba(0,0,0,0.06)';
      // vertical line at grid-x = i
      const v1 = gridToPixel(i, -half), v2 = gridToPixel(i, half);
      ctx.beginPath(); ctx.moveTo(v1.x, v1.y); ctx.lineTo(v2.x, v2.y); ctx.stroke();
      // horizontal line at grid-y = i
      const h1 = gridToPixel(-half, i), h2 = gridToPixel(half, i);
      ctx.beginPath(); ctx.moveTo(h1.x, h1.y); ctx.lineTo(h2.x, h2.y); ctx.stroke();
    }
    ctx.restore();
  }

  function render() {
    animationTime = Date.now();
    clearCanvas();
    if (!nodes || nodes.length === 0) return;

    ctx.save();
    applyTransform();

    // Snap-grid overlay (only while dragging a node in the tool)
    if (showGridOverlay) drawGridOverlay();

    // Filter nodes based on story mode
    let visibleNodes = nodes.filter(n => n.show);
    const highlightedNodes = [];
    const unhighlightedNodes = [];
    
    visibleNodes.forEach(node => {
      // Check if node should be highlighted based on selection AND legend filtering
      let shouldHighlight = shouldHighlightNode(node);
      
      // If color legend filtering is active, dim non-matching nodes
      if (colorFilterActive) {
        const nodeCats = getNodeCategories(node);
        if (nodeCats.length === 0 || !nodeCats.some(c => activeCategories.has(c))) {
          shouldHighlight = false;
        }
      }
      
      // If shape legend filtering is active, dim non-matching nodes
      if (activeShapeCategories.size < uniqueShapeCategories.length) {
        const sc = getNodeShapeCategory(node);
        if (!sc || !activeShapeCategories.has(sc)) {
          shouldHighlight = false;
        }
      }
      
      if (shouldHighlight) {
        highlightedNodes.push(node);
      } else {
        unhighlightedNodes.push(node);
      }
    });

    // Draw unhighlighted nodes first (dimmed)
    unhighlightedNodes.forEach(n => drawNode(n, CONFIG.unconnectedOpacity, CONFIG.showImages));

    const highlightedSet = new Set(highlightedNodes.map(n => n.id));
    let visibleLinks = links.filter(l => l.source.show && l.target.show);
    
    // In story mode, only show links where BOTH nodes are in current view
    if (isStoryMode && sortedViewIds.length > 0) {
      const currentViewId = sortedViewIds[currentViewIndex];
      const currentViewEntities = new Set(viewEntitiesCache.get(currentViewId) || []);
      visibleLinks = visibleLinks.filter(l => currentViewEntities.has(l.source.id) && currentViewEntities.has(l.target.id));
    }
    
    // Draw links - ONLY draw links between highlighted nodes when there's a selection
    // Sort links by priority: selected & hovered > selected & not hovered > unselected & hovered > unselected & not hovered
    
    // Helper function to check if a node's category is active
    const isNodeCategoryActive = (node) => {
      // Color legend filter
      if (colorFilterActive) {
        const nodeCats = getNodeCategories(node);
        if (nodeCats.length === 0 || !nodeCats.some(c => activeCategories.has(c))) return false;
      }
      // Shape legend filter
      if (uniqueShapeCategories.length > 0 && activeShapeCategories.size < uniqueShapeCategories.length) {
        const sc = getNodeShapeCategory(node);
        if (!sc || !activeShapeCategories.has(sc)) return false;
      }
      return true;
    };
    const sortedLinks = visibleLinks.slice().sort((a, b) => {
      const aIsSelected = selectedNode && (a.source === selectedNode || a.target === selectedNode);
      const bIsSelected = selectedNode && (b.source === selectedNode || b.target === selectedNode);
      const aIsHovered = hoveredNode && (a.source === hoveredNode || a.target === hoveredNode);
      const bIsHovered = hoveredNode && (b.source === hoveredNode || b.target === hoveredNode);
      
      // Calculate priority (higher number = drawn later = appears on top)
      const aPriority = (aIsSelected ? 2 : 0) + (aIsHovered ? 1 : 0);
      const bPriority = (bIsSelected ? 2 : 0) + (bIsHovered ? 1 : 0);
      
      return aPriority - bPriority; // Draw lower priority first
    });
    
    if (selectedNode) {
      sortedLinks.forEach(l => {
        if (highlightedSet.has(l.source.id) && highlightedSet.has(l.target.id)) {
          const bothActive = isNodeCategoryActive(l.source) && isNodeCategoryActive(l.target);
          const opacity = bothActive ? CONFIG.linkOpacitySelected : CONFIG.unconnectedOpacity;
          drawLink(l, opacity);
        }
      });
    } else {
      sortedLinks.forEach(l => {
        const bothActive = isNodeCategoryActive(l.source) && isNodeCategoryActive(l.target);
        const opacity = bothActive ? CONFIG.linkOpacityNoSelection : CONFIG.unconnectedOpacity;
        drawLink(l, opacity);
      });
    }

    // Draw highlighted nodes on top
    highlightedNodes.forEach(n => drawNode(n, CONFIG.pointOpacity, CONFIG.showImages));

    // Draw labels based on showNodeLabels setting
    if (formattingSettings.showNodeLabels === 'always') {
      // Draw labels for ALL visible highlighted nodes
      highlightedNodes.forEach(n => drawLabel(n));
      unhighlightedNodes.forEach(n => drawLabel(n));
    } else {
      // Default 'hover' mode: labels on selection, connections, and hover
      if (selectedNode) {
        highlightedNodes.forEach(n => {
          if (adjacency.get(selectedNode.id).has(n.id) || n === selectedNode) {
            drawLabel(n);
          }
        });
      }

      // Draw label for hovered node (if not already labeled)
      if (hoveredNode && hoveredNode !== selectedNode && hoveredNode.show) {
        drawLabel(hoveredNode);
      }
    }

    ctx.restore();
    
    // Schedule next animation frame only if a node is selected (for glow animation)
    if (selectedNode && !animationScheduled) {
      animationScheduled = true;
      setTimeout(() => {
        animationScheduled = false;
        requestAnimationFrame(render);
      }, 50); // ~20 FPS for smooth animation with less CPU usage
    }
  }

  /************************************************************************
   * INTERACTION HELPERS
   ************************************************************************/
  function getCanvasPos(evt) {
    const rect = canvas.getBoundingClientRect();
    const x = (evt.clientX - rect.left) * (canvas.width / (devicePixelRatio)) / rect.width;
    const y = (evt.clientY - rect.top) * (canvas.height / (devicePixelRatio)) / rect.height;
    
    const centerX = (canvas.width/(devicePixelRatio)) / 2;
    const centerY = (canvas.height/(devicePixelRatio)) / 2;
    
    const transformedX = (x - centerX - panX) / zoomLevel + centerX;
    const transformedY = (y - centerY - panY) / zoomLevel + centerY;
    
    return { x: transformedX, y: transformedY };
  }

  function findNodeAtPos(x, y) {
    if (!nodes || nodes.length === 0) return null;
    let visibleNodes = nodes.filter(n => n.show);
    
    if (selectedNode) {
      const activeSet = new Set([selectedNode.id, ...(adjacency.get(selectedNode.id) || [])]);
      const activeNodes = visibleNodes.filter(n => activeSet.has(n.id));
      for (let i = activeNodes.length - 1; i >= 0; i--) {
        const n = activeNodes[i];
        if (Math.hypot(n.x - x, n.y - y) <= n.r) return n;
      }
      const otherNodes = visibleNodes.filter(n => !activeSet.has(n.id));
      for (let i = otherNodes.length - 1; i >= 0; i--) {
        const n = otherNodes[i];
        if (Math.hypot(n.x - x, n.y - y) <= n.r) return n;
      }
    } else {
      for (let i = visibleNodes.length - 1; i >= 0; i--) {
        const n = visibleNodes[i];
        if (Math.hypot(n.x - x, n.y - y) <= n.r) return n;
      }
    }
    return null;
  }

  function updateCanvasCursor() {
    if (isDragging) {
      canvas.style.cursor = 'grabbing';
    } else if (zoomLevel > 1.0) {
      canvas.style.cursor = 'grab';
    } else {
      canvas.style.cursor = 'default';
    }
  }

  /************************************************************************
   * CANVAS EVENT LISTENERS
   ************************************************************************/
  canvas.addEventListener('mousedown', (evt) => {
    if (evt.button !== 0) return;
    if (AUTH && AUTH.onDown(evt)) return; // authoring drag took over

    didDrag = false;

    if (zoomLevel > 1.0) {
      // Panning canvas
      isDragging = true;
      dragStartX = evt.clientX;
      dragStartY = evt.clientY;
      dragStartPanX = panX;
      dragStartPanY = panY;
      updateCanvasCursor();
      evt.preventDefault();
    }
  });

  canvas.addEventListener('mousemove', (evt) => {
    if (AUTH && AUTH.onMove(evt)) return; // authoring drag took over

    if (isDragging && zoomLevel > 1.0) {
      didDrag = true;
      const deltaX = evt.clientX - dragStartX;
      const deltaY = evt.clientY - dragStartY;
      panX = dragStartPanX + deltaX / zoomLevel;
      panY = dragStartPanY + deltaY / zoomLevel;
      render();
      evt.preventDefault();
    } else {
      // Hover effect
      const pos = getCanvasPos(evt);
      const n = findNodeAtPos(pos.x, pos.y);
      if (n !== hoveredNode) {
        hoveredNode = n;
        render();
      }
      if (AUTH && !isStoryMode) {
        canvas.style.cursor = n ? 'grab' : (zoomLevel > 1.0 ? 'grab' : 'default');
      }
    }
  });

  canvas.addEventListener('mouseup', (evt) => {
    if (AUTH && AUTH.onUp(evt)) return; // authoring drag took over

    if (isDragging) {
      isDragging = false;
      updateCanvasCursor();
      
      // Only treat as click if we didn't drag
      if (!didDrag) {
        const pos = getCanvasPos(evt);
        const n = findNodeAtPos(pos.x, pos.y);
        if (n) {
          selectedNode = n;
          if (isStoryMode) {
            showEntityModal(n);
          } else {
            populateInfoPanel(n);
          }
          render();
        } else {
          selectedNode = null;
          if (isStoryMode) {
            hideEntityModal();
          } else {
            clearInfoPanel();
          }
          render();
        }
      }
      evt.preventDefault();
      return;
    }
  });

  canvas.addEventListener('click', (evt) => {
    if (didDrag) {
      didDrag = false;
      evt.preventDefault();
      return;
    }
    if (isDragging) return;
    const pos = getCanvasPos(evt);
    const n = findNodeAtPos(pos.x, pos.y);
    if (n) {
      selectedNode = n;
      if (isStoryMode) {
        showEntityModal(n);
      } else {
        populateInfoPanel(n);
      }
      render();
    } else {
      selectedNode = null;
      hoveredConnection = null;
      if (isStoryMode) {
        hideEntityModal();
      } else {
        clearInfoPanel();
      }
      render();
    }
  });

  canvas.addEventListener('mouseleave', (evt) => {
    isDragging = false;
    didDrag = false;
    updateCanvasCursor();
    if (hoveredNode) {
      hoveredNode = null;
      render();
    }
  });

  canvas.addEventListener('wheel', (evt) => {
    evt.preventDefault();
    if (evt.deltaY < 0) {
      zoomIn();
    } else {
      zoomOut();
    }
  });

  /************************************************************************
   * ZOOM CONTROLS
   ************************************************************************/
  function zoomIn() {
    zoomLevel = Math.min(CONFIG.zoomMax, zoomLevel + CONFIG.zoomStep);
    updateCanvasCursor();
    render();
  }
  
  function zoomOut() {
    zoomLevel = Math.max(CONFIG.zoomMin, zoomLevel - CONFIG.zoomStep);
    updateCanvasCursor();
    render();
  }
  
  function resetZoom() {
    zoomLevel = 0.9;
    panX = 0;
    panY = 0;
    
    // CRITICAL: Clear inline styles that lock canvas size!
    // resizeCanvas() sets inline styles, which prevent proper resizing
    canvas.style.width = '';
    canvas.style.height = '';
    
    // Force reflow so getBoundingClientRect() reads the CSS size
    void canvas.offsetHeight;
    
    // Now resize canvas (will read correct CSS dimensions)
    resizeCanvas();
    
    // Rescale nodes to fit the actual available space
    if (nodes.length > 0) {
      computeGridLayout();
    }
    
    // Update simulation center
    if (simulation && simulation.force) { 
      const c = simulation.force('center'); 
      if (c) {
        c.x((canvas.width/(devicePixelRatio))/2);
        c.y((canvas.height/(devicePixelRatio))/2);
      }
    }
    
    updateCanvasCursor();
    render();

      if (document.exitFullscreen) {

      } else if (document.webkitExitFullscreen) { // Safari

    for (const name of searchSpace) {
      if (name && name.toLowerCase().includes(term)) matches.push(name);

        showEntityModal(exact);

      msgEl.text('');

    const matches = searchNodes.filter(n => n.name && n.name.toLowerCase().includes(q.toLowerCase()));
    if (matches.length === 1) {
      selectedNode = matches[0];
      
      if (isStoryMode) {
        showEntityModal(matches[0]);
      } else {
        populateInfoPanel(matches[0]);
      }
      
      render(); 
      msgEl.text(''); 
      return;
    } else if (matches.length > 1) {
      suggestionsEl.style('display','block').html('');

        suggestionsEl.append('div').attr('class','suggestion').text(m.name).on('click', () => {

    } else {
      msgEl.text('Search term not found. Please try again.');
    }
  }

function parseNum(v) {
  if (v == null || String(v).trim() === '') return NaN;
  const cleaned = String(v).replace(/[^0-9.\-eE]/g, '');
  if (cleaned === '' || cleaned === '-' || cleaned === '.') return NaN;
  return Number(cleaned);

function luminance(hex) {
  hex = hex.replace('#', '');
  if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
  const s = [0, 2, 4].map(i => parseInt(hex.substring(i, i + 2), 16) / 255);
  const l = s.map(c => c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));

//  CSV PARSER

function parseCSV(text) {
  const result = []; let row = [], field = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i], n = text[i + 1];
    if (inQ) { if (c === '"' && n === '"') { field += '"'; i++ } else if (c === '"') inQ = false; else field += c }
    else {
      if (c === '"') inQ = true;
      else if (c === ',') { row.push(field); field = '' }
      else if (c === '\r' && n === '\n') { row.push(field); field = ''; result.push(row); row = []; i++ }
      else if (c === '\n' || c === '\r') { row.push(field); field = ''; result.push(row); row = [] }
      else field += c;
    }
  }
  row.push(field); result.push(row);
  const filtered = result.filter(r => r.some(f => f.trim() !== ''));
  if (!filtered.length) return { headers: [], rows: [] };
  const maxC = Math.min(Math.max(...filtered.map(r => r.length)), 30);
  filtered.forEach(r => { while (r.length < maxC) r.push(''); r.length = maxC });
  return { headers: filtered[0] || [], rows: filtered.slice(1) };
}

//  COLUMN TYPE DETECTION

function detectNumCols() {
  numCols = new Set();
  headers.forEach((_, ci) => {
    const vals = rawRows.filter(r => r[ci] && r[ci].trim() !== '');
    if (!vals.length) return;
    const ok = vals.filter(r => !isNaN(parseNum(r[ci]))).length;
    if (ok / vals.length >= .9) numCols.add(ci);

//  SORTING
// ═══════════════════════════════════════════════════════════════════════════════

function sortRows(rows) {
  if (!sortStack.length) return rows;
  const sorted = [...rows];
  sorted.sort((a, b) => {
    for (const s of sortStack) {
      const av = a[s.col] ?? '', bv = b[s.col] ?? '';
      const an = parseNum(av), bn = parseNum(bv);
      let cmp = 0;
      if (!isNaN(an) && !isNaN(bn)) { cmp = an - bn }
      else { cmp = String(av).localeCompare(String(bv), undefined, { sensitivity: 'base' }) }
      if (cmp !== 0) return s.dir === 'asc' ? cmp : -cmp;

    return 0;
  });

function filterRows(rows) {
  const activeFilters = Object.entries(filters).filter(([_, s]) => s.size > 0);

  if (!activeFilters.length && !activeBtnFilters.length) return rows;
  return rows.filter(row => {
    for (const [ciStr, allowed] of activeFilters) {
      const ci = parseInt(ciStr);

      if (!vals.some(v => allowed.has(v))) return false;
    }
    for (const [hdrName, allowed] of activeBtnFilters) {

      if (!vals.some(v => allowed.has(v))) return false;

    const sumCells = new Array(headers.length).fill('');
    const aggValues = {};
    gi.forEach(c => { sumCells[c] = groupRows[0][c] });
    ci.forEach(c => {
      if (numCols.has(c)) {
        sumCells[c] = hasActiveFilters() ? 'FILTER APPLIED' : 'ALL';
      } else {
        const uniqueCount = new Set(groupRows.map(r => String(r[c]).trim())).size;
        sumCells[c] = hasActiveFilters() ? `FILTERED (${uniqueCount})` : `ALL (${uniqueCount})`;
      }
    });
    ni.forEach(c => {
      const vs = groupRows.map(r => parseNum(r[c])).filter(v => !isNaN(v));
      if (vs.length) {
        const agg = S.aggregationMode === 'AVG' ? vs.reduce((a, b) => a + b, 0) / vs.length : vs.reduce((a, b) => a + b, 0);
        aggValues[c] = agg;
        const sample = groupRows.find(r => r[c] && r[c].trim() !== '');
        sumCells[c] = formatAgg(agg, sample ? sample[c] : '');
      }
    });

    return { key, groupRows, expanded, sumCells, aggValues };
  });

  // 3. Sort groups by sortStack
  const collSet = new Set(ci);
  if (sortStack.length) {
    groups.sort((a, b) => {
      for (const s of sortStack) {
        let cmp = 0;
        if (s.col in a.aggValues || s.col in b.aggValues) {
          const av = a.aggValues[s.col] ?? 0, bv = b.aggValues[s.col] ?? 0;
          cmp = av - bv;
        } else if (collSet.has(s.col) && !numCols.has(s.col)) {
          const extract = v => { const m = String(v).match(/\((\d+)\)$/); return m ? parseInt(m[1]) : 0 };
          cmp = extract(a.sumCells[s.col]) - extract(b.sumCells[s.col]);
        } else {
          const av = String(a.sumCells[s.col] ?? ''), bv = String(b.sumCells[s.col] ?? '');
          cmp = av.localeCompare(bv, undefined, { sensitivity: 'base' });
        }
        if (cmp !== 0) return s.dir === 'asc' ? cmp : -cmp;
      }
      return 0;
    });
  }

  // 4. Build output: each group's summary, then sorted detail rows
  const hasNumeric = ni.length > 0;
  const out = [];
  groups.forEach(g => {
    if (!g.expanded || hasNumeric) {
      out.push({ cells: g.sumCells, type: 'summary', groupKey: g.key, expanded: g.expanded });
    }
    if (g.expanded) {
      const sorted = sortRows(g.groupRows);
      const seen = new Set();
      let first = true;
      sorted.forEach(row => {
        const dedupeKey = ci.map(c => row[c] ?? '').join('|||');
        if (seen.has(dedupeKey)) return;
        seen.add(dedupeKey);
        const entry = { cells: [...row], type: 'detail', groupKey: g.key };
        if (!hasNumeric && first) { entry.needsToggle = true; first = false }
        out.push(entry);
      });
    }
  });
  return out;
}

// Format an aggregated number mimicking the source column's format
function formatAgg(num, sampleVal) {
  const s = String(sampleVal);
  const prefixMatch = s.match(/^([€$£¥₹₽₩])/);
  const prefix = prefixMatch ? prefixMatch[1] : '';
  const dotMatch = s.replace(/[^0-9.]/g, '').match(/\.(\d+)$/);
  const decimals = dotMatch ? dotMatch[1].length : 0;
  const formatted = Math.abs(num).toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
  const sign = num < 0 ? '-' : '';
  const label = S.aggregationMode === 'AVG' ? ' (Avg)' : ' (Total)';
  return sign + prefix + formatted + label;
}

// ═══════════════════════════════════════════════════════════════════════════════
//  SUPPRESSION & MERGE SPANS
// ═══════════════════════════════════════════════════════════════════════════════

function isAllCell(v) { const s = String(v); return s === 'ALL' || s.startsWith('ALL (') || s === 'FILTER APPLIED' || s.startsWith('FILTERED (') }

function isSuppressed(rows, ri, ci) {
  if (ri === 0) return false;
  if (numCols.has(ci)) return false;
  const cur = rows[ri].cells[ci], prev = rows[ri - 1].cells[ci];
  if (isAllCell(cur)) return false;
  if (cur !== prev) return false;
  for (let c = 0; c < ci; c++) { if (rows[ri].cells[c] !== rows[ri - 1].cells[c]) return false }
  return true;
}

function computeMerges(pageRows) {
  const map = pageRows.map(() => headers.map(() => ({ span: 1 })));
  for (let ci = 0; ci < headers.length; ci++) {
    if (numCols.has(ci)) continue;
    let mergeStart = 0;
    for (let ri = 1; ri < pageRows.length; ri++) {
      if (isSuppressed(pageRows, ri, ci)) {
        map[ri][ci] = { skip: true };
        map[mergeStart][ci].span++;
      } else {
        mergeStart = ri;
      }
    }
  }
  return map;
}

// ═══════════════════════════════════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════════════════════════════════

function renderTable() {
  const app = appEl();
  if (!app) return;
  if (!headers.length) return;
  const rpp = rowsPerPage();
  const allRows = buildView();
  const total = allRows.length;
  const pages = Math.max(1, Math.ceil(total / rpp));
  if (currentPage > pages) currentPage = pages;

  const start = (currentPage - 1) * rpp;
  const end = Math.min(start + rpp, total);
  const pageRows = allRows.slice(start, end);

  const hc = hasColl();
  const hBg = S.headerColor, hTx = txtClr(hBg);
  const tBg = S.tableColor;
  const aBg = S.alternateRowColors ? darken(tBg, .08) : tBg;
  const visCols = visibleColIndices();
  const colCount = visCols.length;
  const toggleW = 32;
  const minColW = 100;
  const totalMinW = (colCount * minColW) + (hc ? toggleW : 0);

  const merges = computeMerges(pageRows);

  let o = '';

  // ── Status bar ──
  o += '<div id="status-bar">';
  o += '<div class="left">';
  if (hc) {
    o += '<button class="share-btn" onclick="TBL.expandAll()">Expand all</button>';
    o += '<button class="share-btn" onclick="TBL.collapseAll()">Collapse all</button>';
  }
  const filteredTotal = filterRows(rawRows).length;
  const showing = hasActiveFilters() ? `${filteredTotal.toLocaleString()} of ${rawRows.length.toLocaleString()} rows` :
    `${rawRows.length.toLocaleString()} row${rawRows.length !== 1 ? 's' : ''}`;
  o += `<span>${showing}`;
  if (hc) { const ec = Object.values(groupExpanded).filter(Boolean).length; o += ` &middot; ${ec} group${ec !== 1 ? 's' : ''} expanded` }
  o += '</span></div>';

  o += '<div class="center"></div>';

  o += '<div class="right">';
  const rightParts = [];
  if (S.shareLink) rightParts.push(`<a class="source-link" href="javascript:void(0)" onclick="TBL.copyShare(this)" title="Copy link to clipboard">Share</a>`);
  rightParts.push(`<a class="source-link" href="javascript:void(0)" onclick="TBL.downloadCSV()">Download data</a>`);
  if (S.sourceText) {
    let src = '<span class="source-label">Source:</span>';
    if (S.sourceLink) src += `<a class="source-link" href="${esc(S.sourceLink)}" target="_blank" rel="noopener">${esc(S.sourceText)}</a>`;
    else src += `<span class="source-link">${esc(S.sourceText)}</span>`;
    rightParts.push(src);
  }
  o += rightParts.join('<span class="source-label">&nbsp;&middot;&nbsp;</span>');
  o += '</div></div>';

  // ── Filter bar ──
  o += `<div id="filter-bar" class="${hasActiveFilters() ? 'active' : ''}">`;
  o += '<span>Filters active</span>';
  o += '<button class="clear-filters-btn" onclick="TBL.clearAllFilters()">Clear all filters</button>';
  o += '</div>';

  // ── Button filter bar ──
  const bfCols = effList('filterButtonColumns');
  if (bfCols.length > 0) {
    o += '<div id="btn-filter-bar">';
    bfCols.forEach(hdrName => {
      const bf = btnFilters[hdrName];
      const isActive = bf && bf.size > 0;
      const uniqueCount = btnFilterUniqueVals(hdrName).length;
      const label = isActive ? `${hdrName} (${bf.size}/${uniqueCount})` : hdrName;
      o += `<div class="bf-group" data-bf-hdr="${esc(hdrName)}">`;
      o += `<button class="bf-btn ${isActive ? 'bf-active' : ''}" onclick="TBL.toggleBtnFilter(event,'${esc(hdrName)}')">${esc(label)} <span class="bf-arrow">▼</span></button>`;
      o += `</div>`;
    });
    o += '</div>';
  }

  // ── Chart area outline ──
  o += '<div id="chart-outline">';

  // ── Table ──
  o += '<div id="table-wrapper">';
  o += `<table id="data-table" style="width:100%;min-width:${totalMinW}px;">`;

  o += '<colgroup>';
  if (hc) o += `<col style="width:${toggleW}px;">`;
  for (let i = 0; i < colCount; i++) o += '<col>';
  o += '</colgroup>';

  // ── THEAD ──
  o += `<thead style="font-size:${S.headerFontSize}px;"><tr>`;
  if (hc) o += `<th class="tcol col-sticky" style="background:${hBg};color:${hTx};left:0;"></th>`;

  visCols.forEach((ci) => {
    const hdr = headers[ci];
    let cls = '';
    let sty = `background:${hBg};color:${hTx};`;
    if (S.lockFirstColumn && ci === visCols[0]) { cls += ' col-sticky'; sty += `left:${hc ? toggleW : 0}px;` }

    o += `<th class="${cls}" data-ci="${ci}" style="${sty}">`;
    o += '<div class="th-content">';
    o += `<span class="th-label">${esc(hdr)}</span>`;
    o += '<span class="th-btns">';

    if (S.userCanFilterColumns && !numCols.has(ci)) {
      const fActive = filters[ci] && filters[ci].size > 0;
      o += `<button class="filter-btn ${fActive ? 'active-filter' : ''}" onclick="TBL.toggleFilter(event,${ci})" title="Filter">☰</button>`;
    }

    if (S.userCanSortColumns) {
      const si = sortStack.findIndex(s => s.col === ci);
      const active = si >= 0;
      const dir = active ? sortStack[si].dir : null;
      const arrow = dir === 'asc' ? '▲' : dir === 'desc' ? '▼' : '⇅';
      const badge = active && sortStack.length > 1 ? `<span class="sort-badge">${si + 1}</span>` : '';
      o += `<button class="sort-btn ${active ? 'active-sort' : ''}" onclick="TBL.cycleSort(${ci})" title="Sort">${arrow}${badge}</button>`;
    }

    o += '</span></div></th>';
  });
  o += '</tr></thead>';

  // ── TBODY ──
  toggleGroupSets = [];
  const toggleSetMap = {};
  if (hc) {
    for (let ri = 0; ri < pageRows.length; ri++) {
      const m = merges[ri][0];
      if (!m.skip) {
        const keys = [];
        for (let r = ri; r < ri + m.span && r < pageRows.length; r++) {
          if (pageRows[r].type === 'summary' || pageRows[r].needsToggle) keys.push(pageRows[r].groupKey);
        }
        if (keys.length) {
          toggleSetMap[ri] = toggleGroupSets.length;
          toggleGroupSets.push(keys);
        }
      }
    }
  }

  o += `<tbody style="font-size:${S.tableFontSize}px;">`;
  pageRows.forEach((row, ri) => {
    const even = ri % 2 === 1;
    const bg = even ? aBg : tBg;
    const tc = txtClr(bg);
    const isSummary = row.type === 'summary';

    o += `<tr data-ri="${ri}" style="background:${bg};color:${tc};">`;

    if (hc) {
      const toggleMerge = merges[ri][0];
      if (toggleMerge.skip) {
        // merged into the row above
      } else {
        let btn = '';
        if ((isSummary || row.needsToggle) && toggleSetMap[ri] != null) {
          const setIdx = toggleSetMap[ri];
          const setKeys = toggleGroupSets[setIdx];
          const anyExpanded = setKeys.some(k => !!groupExpanded[k]);
          const icon = anyExpanded ? '−' : '+';
          btn = `<button class="tbtn" style="color:${tc};border-color:${tc === C.textLight ? C.overlayBorderLight : C.overlayBorder};" onclick="TBL.toggleGroupSet(${setIdx})">${icon}</button>`;
        }
        const tSpan = toggleMerge.span > 1 ? ` rowspan="${toggleMerge.span}"` : '';
        o += `<td class="tcol col-sticky" data-ci="-1"${tSpan} style="left:0;background:${bg};">${btn}</td>`;
      }
    }

    visCols.forEach((ci) => {
      const m = merges[ri][ci];
      if (m.skip) return;

      const val = row.cells[ci] ?? '';
      const isN = numCols.has(ci);
      const isAgg = isSummary && isN && String(val).includes('(');
      const isAll = isAllCell(val);

      let cls = [];
      if (isAgg) cls.push('agg-cell');
      else if (isN) cls.push('num-cell');
      if (isAll) cls.push('all-cell');

      let sty = '';
      if (m.span > 1) { sty += `background:${bg};`; }

      if (S.lockFirstColumn && ci === visCols[0]) {
        cls.push('col-sticky');
        sty += `left:${hc ? toggleW : 0}px;`;
        if (m.span <= 1) sty += `background:${bg};`;
      }

      const rowspanAttr = m.span > 1 ? ` rowspan="${m.span}"` : '';

      let display = '';
      if (isAgg || isAll) { display = esc(String(val)) }
      else { display = esc(String(val)).replace(/\n/g, '<br>') }

      o += `<td class="${cls.join(' ')}" data-ci="${ci}"${rowspanAttr} style="${sty}">${display}</td>`;
    });

    o += '</tr>';
  });
  o += '</tbody></table></div>';

  // ── Pagination ──
  if (pages > 1) {
    o += '<div id="pag-bar">';
    o += `<button class="pg" ${currentPage === 1 ? 'disabled' : ''} onclick="TBL.goPage(${currentPage - 1})">&#8249;</button>`;
    pagRange(currentPage, pages).forEach(p => {
      if (p === '...') o += '<span class="pgd">&hellip;</span>';
      else o += `<button class="pg ${p === currentPage ? 'pga' : ''}" onclick="TBL.goPage(${p})">${p}</button>`;
    });
    o += `<button class="pg" ${currentPage === pages ? 'disabled' : ''} onclick="TBL.goPage(${currentPage + 1})">&#8250;</button>`;
    o += '</div>';
  }

  o += '</div>'; // close #chart-outline

  app.innerHTML = o;
  setupHover();
}

function pagRange(cur, tot) {
  if (tot <= 7) return Array.from({ length: tot }, (_, i) => i + 1);
  const p = [1];
  if (cur > 3) p.push('...');
  for (let i = Math.max(2, cur - 1); i <= Math.min(tot - 1, cur + 1); i++) p.push(i);
  if (cur < tot - 2) p.push('...');
  p.push(tot);
  return p;
}

// ═══════════════════════════════════════════════════════════════════════════════
//  HOVER
// ═══════════════════════════════════════════════════════════════════════════════

function setupHover() {
  const table = document.getElementById('data-table');
  if (!table) return;
  let lastRI = null, lastCI = null;

  table.addEventListener('mouseover', e => {
    const td = e.target.closest('td,th');
    if (!td) return;
    const ci = td.getAttribute('data-ci');
    const tr = td.closest('tr');
    const ri = tr ? tr.getAttribute('data-ri') : null;
    if (ci === lastCI && ri === lastRI) return;

    clearHover(table);
    lastRI = ri; lastCI = ci;
    if (ci == null || ci === '-1' || ri == null) return;

    if (ri != null) {
      const row = table.querySelector(`tbody tr[data-ri="${ri}"]`);
      if (row) row.classList.add('row-hover');
    }
    table.querySelectorAll(`tbody td[data-ci="${ci}"]`).forEach(c => c.classList.add('col-hover'));
    const th = table.querySelector(`thead th[data-ci="${ci}"]`);
    if (th) th.classList.add('col-hover');
  });

  table.addEventListener('mouseleave', () => { clearHover(table); lastRI = null; lastCI = null });
}

function clearHover(table) {
  table.querySelectorAll('.row-hover').forEach(el => el.classList.remove('row-hover'));
  table.querySelectorAll('.col-hover').forEach(el => el.classList.remove('col-hover'));
}

// ═══════════════════════════════════════════════════════════════════════════════
//  SORT
// ═══════════════════════════════════════════════════════════════════════════════

function cycleSort(ci) {
  const existing = sortStack.findIndex(s => s.col === ci);
  if (existing < 0) {
    sortStack.unshift({ col: ci, dir: 'asc' });
  } else {
    const cur = sortStack[existing];
    if (cur.dir === 'asc') {
      cur.dir = 'desc';
      sortStack.splice(existing, 1);
      sortStack.unshift(cur);
    } else {
      sortStack.splice(existing, 1);
    }
  }
  currentPage = 1;
  renderTable();
}

// ═══════════════════════════════════════════════════════════════════════════════
//  FILTER
// ═══════════════════════════════════════════════════════════════════════════════

function toggleFilter(event, ci) {
  event.stopPropagation();
  if (openFilter === ci) { closeFilterDropdown(); return }
  closeFilterDropdown();
  closeBtnFilterDropdown();
  openFilter = ci;

  const uniqueVals = uniqueColVals(ci);
  const currentFilter = filters[ci] || new Set();
  const hasFilter = currentFilter.size > 0;

  const btn = event.target.closest('.filter-btn');
  const rect = btn.getBoundingClientRect();
  const wrapper = document.getElementById('table-wrapper');
  const wrapRect = wrapper.getBoundingClientRect();

  const dd = document.createElement('div');
  dd.className = 'filter-dropdown';
  dd.id = 'filter-dd';

  let left = rect.left - wrapRect.left + wrapper.scrollLeft;
  let top = rect.bottom - wrapRect.top + wrapper.scrollTop + 4;
  if (left + 220 > wrapRect.width + wrapper.scrollLeft) left = rect.right - 220 - wrapRect.left + wrapper.scrollLeft;
  dd.style.left = left + 'px';
  dd.style.top = top + 'px';

  const tempSelected = hasFilter ? new Set(currentFilter) : new Set(uniqueVals);

  function renderList(searchTerm) {
    const filtered = searchTerm ? uniqueVals.filter(v => v.toLowerCase().includes(searchTerm.toLowerCase())) : uniqueVals;
    const listEl = dd.querySelector('.fd-list');
    listEl.innerHTML = '';
    filtered.forEach(v => {
      const checked = tempSelected.has(v);
      const item = document.createElement('div');
      item.className = 'fd-item';
      item.innerHTML = `<input type="checkbox" ${checked ? 'checked' : ''} data-val="${esc(v)}"><label>${esc(v || '(empty)')}</label>`;
      item.querySelector('input').addEventListener('change', e => {
        if (e.target.checked) tempSelected.add(v); else tempSelected.delete(v);
      });
      item.querySelector('label').addEventListener('click', () => {
        const cb = item.querySelector('input');
        cb.checked = !cb.checked;
        if (cb.checked) tempSelected.add(v); else tempSelected.delete(v);
      });
      listEl.appendChild(item);
    });
  }

  dd.innerHTML = `
    <div class="fd-search"><input type="text" placeholder="Search values…"></div>
    <div class="fd-list"></div>
    <div class="fd-actions">
      <button onclick="TBL.applyFilter(${ci},'select-all')">Select All</button>
      <button onclick="TBL.applyFilter(${ci},'clear-all')">Clear All</button>
      <button class="fd-apply" onclick="TBL.applyFilter(${ci},'apply')">Apply</button>
    </div>
  `;

  wrapper.style.position = 'relative';
  wrapper.appendChild(dd);

  renderList('');

  const searchInput = dd.querySelector('.fd-search input');
  searchInput.addEventListener('input', e => renderList(e.target.value));
  searchInput.focus();

  dd._tempSelected = tempSelected;
  dd._uniqueVals = uniqueVals;
  dd._renderList = renderList;

  setTimeout(() => {
    document.addEventListener('click', closeFilterOnOutside);
  }, 0);
}

function closeFilterOnOutside(e) {
  const dd = document.getElementById('filter-dd');
  if (dd && !dd.contains(e.target) && !e.target.closest('.filter-btn')) {
    closeFilterDropdown();
  }
}

function closeFilterDropdown() {
  openFilter = null;
  const dd = document.getElementById('filter-dd');
  if (dd) dd.remove();
  document.removeEventListener('click', closeFilterOnOutside);
}

function applyFilter(ci, action) {
  const dd = document.getElementById('filter-dd');
  if (!dd) return;

  if (action === 'select-all') {
    dd._tempSelected.clear();
    dd._uniqueVals.forEach(v => dd._tempSelected.add(v));
    dd._renderList(dd.querySelector('.fd-search input').value);
    return;
  }
  if (action === 'clear-all') {
    dd._tempSelected.clear();
    dd._renderList(dd.querySelector('.fd-search input').value);
    return;
  }
  if (action === 'apply') {
    const sel = dd._tempSelected;
    const all = dd._uniqueVals;
    if (sel.size === all.length || sel.size === 0) {
      delete filters[ci];
    } else {
      filters[ci] = new Set(sel);
    }
    closeFilterDropdown();
    currentPage = 1;
    renderTable();
  }
}

function clearAllFilters() {
  filters = {};
  btnFilters = {};
  currentPage = 1;
  renderTable();
}

function closeBtnFilterDropdown() {
  openBtnFilter = null;
  const dd = document.getElementById('bf-filter-dd');
  if (dd) dd.remove();
  document.removeEventListener('click', closeBtnFilterOnOutside);
}

function applyBtnFilter(hdrName, action) {
  const dd = document.getElementById('bf-filter-dd');
  if (!dd) return;

  if (action === 'select-all') {
    dd._tempSelected.clear();
    dd._uniqueVals.forEach(v => dd._tempSelected.add(v));
    dd._renderList(dd.querySelector('.bfd-search input').value);
    return;
  }
  if (action === 'clear-all') {
    dd._tempSelected.clear();
    dd._renderList(dd.querySelector('.bfd-search input').value);
    return;
  }
  if (action === 'apply') {
    const sel = dd._tempSelected;
    const all = dd._uniqueVals;
    if (sel.size === all.length || sel.size === 0) {
      delete btnFilters[hdrName];
    } else {
      btnFilters[hdrName] = new Set(sel);
    }
    closeBtnFilterDropdown();
    currentPage = 1;
    renderTable();
  }
}

//  EVENT HANDLERS
// ═══════════════════════════════════════════════════════════════════════════════

function toggleGroupSet(setIdx) {
  const keys = toggleGroupSets[setIdx];
  if (!keys || !keys.length) return;
  const anyExpanded = keys.some(k => !!groupExpanded[k]);
  keys.forEach(k => { groupExpanded[k] = !anyExpanded });
  renderTable();
}
function expandAll() {
  if (!hasColl()) return;
  const gi = groupKeyIdx();
  filterRows(rawRows).forEach(row => {
    const key = gi.map(i => row[i] ?? '').join('|||');
    groupExpanded[key] = true;
  });
  currentPage = 1; renderTable();
}
function collapseAll() { groupExpanded = {}; currentPage = 1; renderTable() }

function copyShare(btn) {
  navigator.clipboard.writeText(S.shareLink).then(() => {
    const orig = btn.textContent;
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.textContent = orig }, 1500);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = S.shareLink; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
    const orig = btn.textContent;
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.textContent = orig }, 1500);
  });
}

function downloadCSV() {
  const csvEsc = v => { const s = String(v); return s.includes(',') || s.includes('"') || s.includes('\n') ? '"' + s.replace(/"/g, '""') + '"' : s };
  const lines = [headers.map(csvEsc).join(',')];
  rawRows.forEach(r => { lines.push(r.map(csvEsc).join(',')) });
  const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = sanitizeFilename(state.name || 'data') + '.csv'; a.style.display = 'none';
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

function goPage(p) {
  const allRows = buildView();
  const tot = Math.max(1, Math.ceil(allRows.length / rowsPerPage()));
  if (p < 1 || p > tot) return;
  currentPage = p; renderTable();
  const tw = document.getElementById('table-wrapper'); if (tw) tw.scrollTop = 0;
}

//  LOAD / REFRESH / SHOW-HIDE / BOOT
// ═══════════════════════════════════════════════════════════════════════════════

function showError(t, m) { const app = appEl(); if (app) app.innerHTML = `<div id="err-screen"><h2>${t}</h2><p>${m}</p></div>` }
function showLoading() { const app = appEl(); if (app) app.innerHTML = '<div id="load-screen"><div class="spin"></div>Loading&hellip;</div>' }

// Ingest raw CSV text: parse, detect columns and render. If the column
// headers changed, volatile UI state (filters/sorts/expansion) is reset.
function ingest(text) {
  const parsed = parseCSV(text);
  const newHeaders = (parsed.headers || []).map(h => h.trim());
  const sameHeaders = headers.length > 0 && newHeaders.length === headers.length && newHeaders.every((h, i) => h === headers[i]);
  headers = newHeaders;
  rawRows = parsed.rows;
  if (!headers.length || !rawRows.length) { showError('Empty Data', 'The data source returned no rows.'); return }
  detectNumCols();
  if (!sameHeaders) { filters = {}; btnFilters = {}; sortStack = []; groupExpanded = {}; }
  currentPage = 1;
  if (!sameHeaders && !S.defaultToCollapsedColumns && hasColl()) {
    const gi = groupKeyIdx();
    rawRows.forEach(row => {
      const key = gi.map(i => row[i] ?? '').join('|||');
      groupExpanded[key] = true;
    });
  }
  renderTable();
  if (typeof window.__onTableDataLoaded === 'function') window.__onTableDataLoaded();
}

// Full (re)load from the current connection (sheet fetch or CSV snapshot).
async function load() {
  showLoading();
  try {
    let text;
    if (state.source === 'csv') {
      text = state.csvText;
      if (!text) throw new Error('No uploaded CSV data. Use the connection screen to upload a CSV.');
    } else {
      if (!state.url) throw new Error('No Google Sheet connected.');
      let u = toCSVUrl(state.url);
      u += (u.includes('?') ? '&' : '?') + '_=' + Date.now(); // cache-buster
      const resp = await fetch(u);
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      text = await resp.text();
      if (text.trimStart().startsWith('<!') || text.trimStart().startsWith('<html'))
        throw new Error('Got a web page instead of CSV — share the sheet as "Anyone with the link can view".');
    }
    ingest(text);
  } catch (err) {
    console.error(err);
    showError('Failed to Load', `Error: <em>${esc(err.message)}</em><br><br>Check the connection and sharing settings.`);
  }
}

// Refresh the live Google Sheets connection (no-op for CSV mode).
async function refresh() {
  if (state.source !== 'sheets') { await load(); return; }
  try {
    let u = toCSVUrl(state.url);
    u += (u.includes('?') ? '&' : '?') + '_=' + Date.now();
    const resp = await fetch(u);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const text = await resp.text();
    if (text.trimStart().startsWith('<!') || text.trimStart().startsWith('<html'))
      throw new Error('Got a web page instead of CSV — check sharing settings.');
    ingest(text);
  } catch (err) {
    alert('Refresh failed: ' + err.message);
  }
}

// Show/hide the table component (swaps with the mapper's #wrap).
function show() {
  const w = document.getElementById('wrap'); if (w) w.style.display = 'none';
  const tr = document.getElementById('table-root'); if (tr) tr.style.display = 'flex';
}
function hide() {
  const tr = document.getElementById('table-root'); if (tr) tr.style.display = 'none';
  const w = document.getElementById('wrap'); if (w) w.style.display = 'flex';
}

// Boot from a saved-file data object ({tool:'table', ...}).
function bootEmbedded(data) {
  if (!data) return;
  if (data.settings) Object.assign(S, data.settings);
  state.source = data.source || 'sheets';
  state.url = data.url || '';
  state.csvText = data.csv || '';
  state.name = data.title || 'Table';
  document.title = state.name;
  show();
  load();
}

// Standalone table export: viewer boot stored the embedded data on window.
if (window.__embeddedChartData && window.__embeddedChartData.tool === 'table') {
  bootEmbedded(window.__embeddedChartData);
}

return {
  S, state,
  headers: () => headers.slice(),
  hasData: () => headers.length > 0,
  rerender: renderTable,
  load, refresh, show, hide, bootEmbedded,
  // inline onclick handlers
  expandAll, collapseAll, copyShare, downloadCSV, clearAllFilters,
  toggleBtnFilter, toggleFilter, cycleSort, toggleGroupSet, goPage,
  applyFilter, applyBtnFilter,
};
})();
