  function onSearchInput() {
    const q = searchInput.value.trim();
    suggestionsEl.style('display', 'none').html('');
    msgEl.text('');
    if (!q || q.length < 3) return;
    const term = q.toLowerCase();
    const matches = [];
    
    // In story mode, only search within current view's entities
    let searchSpace = nameIndex;
    if (isStoryMode && sortedViewIds.length > 0) {
      const currentViewId = sortedViewIds[currentViewIndex];
      const currentViewEntities = viewEntitiesCache.get(currentViewId) || [];
      searchSpace = currentViewEntities;
    }
    
    for (const name of searchSpace) {
      if (name && name.toLowerCase().includes(term)) matches.push(name);
      if (matches.length >= CONFIG.maxSuggestions) break;
    }
    if (matches.length === 0) {
      suggestionsEl.style('display','block').html('<div class="muted">No suggestions</div>');
      return;
    }
    suggestionsEl.style('display','block').html('');
    matches.forEach(m => {
      suggestionsEl.append('div').attr('class','suggestion').text(m).on('click', () => {
        searchInput.value = m;
        suggestionsEl.style('display','none').html('');
        performSearch(m);
      });
    });
  }

  function performSearch(q) {
    if (!q) return;
    
    // In story mode, only search within current view's entities
    let searchNodes = nodes;
    if (isStoryMode && sortedViewIds.length > 0) {
      const currentViewId = sortedViewIds[currentViewIndex];
      const currentViewEntities = new Set(viewEntitiesCache.get(currentViewId) || []);
      searchNodes = nodes.filter(n => currentViewEntities.has(n.id));
    }
    
    const exact = searchNodes.find(n => n.name && n.name.toLowerCase() === q.toLowerCase());
    if (exact) {
      selectedNode = exact;
      
      if (isStoryMode) {
        showEntityModal(exact);
      } else {
        populateInfoPanel(exact);
      }
      
      render(); 
      msgEl.text(''); 
      return;
    }
    const matches = searchNodes.filter(n => n.name && n.name.toLowerCase().includes(q.toLowerCase()));
    if (matches.length === 1) {
      selectedNode = matches[0];
      
      if (isStoryMode) {
        showEntityModal(matches[0]);
      } else {
        populateInfoPanel(matches[0]);
      }
      
      render(); 
      msgEl.text(''); 
      return;
    } else if (matches.length > 1) {
      suggestionsEl.style('display','block').html('');
      matches.slice(0, CONFIG.maxSuggestions).forEach(m => {
        suggestionsEl.append('div').attr('class','suggestion').text(m.name).on('click', () => {
          searchInput.value = m.name;
          suggestionsEl.style('display','none').html('');
          selectedNode = m;
          
          if (isStoryMode) {
            showEntityModal(m);
          } else {
            populateInfoPanel(m);
          }
          
          render();
        });
      });
      msgEl.text('Multiple matches — click a suggestion.'); 
      return;
    } else {
      msgEl.text('Search term not found. Please try again.');
    }
  }

  /************************************************************************

  storyBtn.addEventListener('click', enterStoryMode);
  storyExitBtn.addEventListener('click', exitStoryMode);

  /************************************************************************

   ************************************************************************/
  /************************************************************************
   * BOOT
   * - Standalone exported file: an embedded #leo-chart-data block exists,
   *   so we apply it and load the chart immediately (pure viewer).
   * - Tool: no embedded data; the authoring shell shows the start page and
   *   triggers loading once the user creates or loads a chart.
   ************************************************************************/
  function readEmbeddedChartData() {
    const el = document.getElementById('leo-chart-data');
    if (!el) return null;
    try { return JSON.parse(el.textContent); }
    catch (e) { console.error('Could not parse embedded chart data:', e); return null; }
  }

  render();
  const __embeddedData = readEmbeddedChartData();
  window.__embeddedChartData = __embeddedData;
  if (__embeddedData && (__embeddedData.tool === 'table' || __embeddedData.tool === 'exprows')) {
    // Standalone table / expandable-rows export: hide the mapper UI; the
    // matching core script (below) boots itself from window.__embeddedChartData.
    const __w = document.getElementById('wrap');
    if (__w) __w.style.display = 'none';
  } else if (__embeddedData) {
    // Standalone mapper export: apply it and load the chart immediately.
    applyChartData(__embeddedData);
    autoLoadData();
  } else {
    // Tool mode: the authoring script will present the start page.
    // Expose the loader so the authoring shell can kick things off.
    window.__startChartLoad = autoLoadData;
  }

function parseNum(v) {
  if (v == null || String(v).trim() === '') return NaN;
  const cleaned = String(v).replace(/[^0-9.\-eE]/g, '');
  if (cleaned === '' || cleaned === '-' || cleaned === '.') return NaN;
  return Number(cleaned);

function luminance(hex) {
  hex = hex.replace('#', '');
  if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
  const s = [0, 2, 4].map(i => parseInt(hex.substring(i, i + 2), 16) / 255);
  const l = s.map(c => c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
  return .2126 * l[0] + .7152 * l[1] + .0722 * l[2];

  return '#' + [0, 2, 4].map(i => {
    const c = Math.max(0, Math.round(parseInt(hex.substring(i, i + 2), 16) * (1 - pct)));
    return c.toString(16).padStart(2, '0');

// ═══════════════════════════════════════════════════════════════════════════════
//  CSV PARSER

function parseCSV(text) {
  const result = []; let row = [], field = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i], n = text[i + 1];
    if (inQ) { if (c === '"' && n === '"') { field += '"'; i++ } else if (c === '"') inQ = false; else field += c }
    else {
      if (c === '"') inQ = true;
      else if (c === ',') { row.push(field); field = '' }
      else if (c === '\r' && n === '\n') { row.push(field); field = ''; result.push(row); row = []; i++ }
      else if (c === '\n' || c === '\r') { row.push(field); field = ''; result.push(row); row = [] }
      else field += c;
    }
  }
  row.push(field); result.push(row);
  const filtered = result.filter(r => r.some(f => f.trim() !== ''));
  if (!filtered.length) return { headers: [], rows: [] };
  const maxC = Math.min(Math.max(...filtered.map(r => r.length)), 30);
  filtered.forEach(r => { while (r.length < maxC) r.push(''); r.length = maxC });
  return { headers: filtered[0] || [], rows: filtered.slice(1) };
}

const DATE_PATTERNS = [
  new RegExp('^\\d{4}(?:[-/]\\d{1,2}|([-/.])\\d{1,2}\\1\\d{1,2})' + TIME_RE + '$', 'i'),         // 2024-01-15, 2024/01, 2024.01.15
  new RegExp('^\\d{1,2}([-/.])\\d{1,2}\\1\\d{2,4}' + TIME_RE + '$', 'i'),                        // 15/01/2024, 1-15-24
  new RegExp('^\\d{1,2}(?:st|nd|rd|th)?[ -]' + MON_RE + '[ ,-]+\\d{2,4}' + TIME_RE + '$', 'i'),      // 15 Jan 2024
  new RegExp('^(?:(?:mon|tue|wed|thu|fri|sat|sun)[a-z]*,?\\s+)?' + MON_RE + '\\s+\\d{1,2}(?:st|nd|rd|th)?,?\\s+\\d{2,4}' + TIME_RE + '$', 'i'), // Jan 15, 2024
  new RegExp('^' + MON_RE + '[ ,\'-]+\\d{2,4}$', 'i'),                                                // Jan 2024, Jan-24
  /^(?:q[1-4][ -]?(?:\d{4}|\d{2})|\d{4}[ -]?q[1-4]|fy ?\d{2,4}(?:[-/]\d{2,4})?)$/i,               // Q1 2024, FY2024
];
// Header names that mark a column of plain years / yyyymmdd as dates
const DATE_HEADER_RE = /\b(date|dates|year|years|yr|yrs|dob|fy|fiscal year|month|period|quarter)\b/i;
function looksLikeDate(v) {
  const s = String(v).trim();
  return s !== '' && DATE_PATTERNS.some(re => re.test(s));
}
function detectDateCols() {
  dateCols = new Set();
  headers.forEach((h, ci) => {
    const vals = rawRows.map(r => String(r[ci] ?? '').trim()).filter(v => v !== '');
    if (!vals.length) return;
    const ok = vals.filter(looksLikeDate).length;
    if (ok / vals.length >= .9) { dateCols.add(ci); return; }
    // e.g. a "Year" column of 2019, 2020, … or a "Date" column of 20240115
    if (DATE_HEADER_RE.test(h) && vals.every(v => /^(\d{4}|\d{6}|\d{8})$/.test(v))) dateCols.add(ci);
  });
}
// Sortable timestamp for a date cell (NaN when it can't be read)
function dateSortVal(v) {
  const s = String(v ?? '').trim();
  if (!s) return NaN;
  if (/^\d{4}$/.test(s)) return Date.UTC(+s, 0, 1);
  if (/^\d{6}$/.test(s)) return Date.UTC(+s.slice(0, 4), +s.slice(4, 6) - 1, 1);
  if (/^\d{8}$/.test(s)) return Date.UTC(+s.slice(0, 4), +s.slice(4, 6) - 1, +s.slice(6, 8));
  let m = s.match(/^q([1-4])[ -]?(\d{2,4})$/i) || null;
  if (m) { const y = m[2].length === 2 ? 2000 + +m[2] : +m[2]; return Date.UTC(y, (+m[1] - 1) * 3, 1); }
  m = s.match(/^(\d{4})[ -]?q([1-4])$/i);
  if (m) return Date.UTC(+m[1], (+m[2] - 1) * 3, 1);
  const t = Date.parse(s.replace(/(\d)(st|nd|rd|th)\b/i, '$1'));
  return t;
}
// Shared comparator: dates by time, numbers by value, everything else as text
function cmpCells(ci, av, bv) {
  av = av ?? ''; bv = bv ?? '';
  if (dateCols.has(ci)) {
    const ad = dateSortVal(av), bd = dateSortVal(bv);
    if (!isNaN(ad) && !isNaN(bd)) return ad - bd;
    if (!isNaN(ad) !== !isNaN(bd)) return isNaN(ad) ? 1 : -1;
    return String(av).localeCompare(String(bv), undefined, { sensitivity: 'base', numeric: true });
  }
  const an = parseNum(av), bn = parseNum(bv);
  if (!isNaN(an) && !isNaN(bn)) return an - bn;
  return String(av).localeCompare(String(bv), undefined, { sensitivity: 'base' });
}

function detectNumCols() {
  detectDateCols();
  numCols = new Set();
  headers.forEach((_, ci) => {
    if (dateCols.has(ci)) return;           // dates are never aggregated
    const vals = rawRows.filter(r => r[ci] && r[ci].trim() !== '');
    if (!vals.length) return;
    const ok = vals.filter(r => !isNaN(parseNum(r[ci]))).length;
    if (ok / vals.length >= .9) numCols.add(ci);
  });
}

// ═══════════════════════════════════════════════════════════════════════════════
//  SORTING
// ═══════════════════════════════════════════════════════════════════════════════

function sortRows(rows) {
  if (!sortStack.length) return rows;
  const sorted = [...rows];
  sorted.sort((a, b) => {
    for (const s of sortStack) {
      const cmp = cmpCells(s.col, a[s.col], b[s.col]);
      if (cmp !== 0) return s.dir === 'asc' ? cmp : -cmp;
    }
    return 0;
  });
  return sorted;
}

// ═══════════════════════════════════════════════════════════════════════════════
//  FILTERING
// ═══════════════════════════════════════════════════════════════════════════════

function filterRows(rows) {
  const activeFilters = Object.entries(filters).filter(([_, s]) => s.size > 0);
  const activeBtnFilters = Object.entries(btnFilters).filter(([_, s]) => s.size > 0);
  const q = searchTerm.trim().toLowerCase();
  if (!activeFilters.length && !activeBtnFilters.length && !q) return rows;
  // Search looks only at the columns shown in the table (not filter-button or hidden columns)
  const searchCols = q ? visibleColIndices() : [];
  return rows.filter(row => {
    if (q && !searchCols.some(ci => String(row[ci] ?? '').toLowerCase().includes(q))) return false;
    for (const [ciStr, allowed] of activeFilters) {
      const ci = parseInt(ciStr);
      const vals = cellValues(ci, row[ci]);
      if (!vals.length) return false;
      if (!vals.some(v => allowed.has(v))) return false;
    }
    for (const [hdrName, allowed] of activeBtnFilters) {
      const ci = headers.indexOf(hdrName);
      if (ci < 0) continue;
      const vals = cellValues(ci, row[ci]);
      if (!vals.length) return false;
      if (!vals.some(v => allowed.has(v))) return false;
    }
    return true;
  });
}

function hasActiveFilters() { return searchTerm.trim() !== '' || Object.values(filters).some(s => s.size > 0) || Object.values(btnFilters).some(s => s.size > 0) }

// ═══════════════════════════════════════════════════════════════════════════════
//  COLLAPSE / EXPAND LOGIC
// ═══════════════════════════════════════════════════════════════════════════════

function collIdx() {
  const s = new Set(effList('collapsibleColumns'));
  const hid = hiddenSet();
  return headers.map((h, i) => (s.has(h) && !hid.has(h)) ? i : -1).filter(i => i >= 0);
}
function groupKeyIdx() {
  const cs = new Set(collIdx());
  const bf = bfTableExcludedSet();
  const hid = hiddenSet();
  return headers.map((h, i) => (!cs.has(i) && !numCols.has(i) && !bf.has(h) && !hid.has(h)) ? i : -1).filter(i => i >= 0);
}
function hasColl() { return collIdx().length > 0 }

function buildView() {
  pruneHidden();
  let processed = filterRows(rawRows);

  if (!hasColl()) {
    processed = sortRows(processed);
    return processed.map(r => ({ cells: [...r], type: 'detail', groupKey: null }));
  }

  const ci = collIdx(), gi = groupKeyIdx(), ni = aggNumCols();

  // 1. Group filtered rows
  const groupMap = new Map(), groupOrder = [];
  processed.forEach(row => {
    const key = gi.map(i => row[i] ?? '').join('|||');
    if (!groupMap.has(key)) { groupMap.set(key, []); groupOrder.push(key) }
    groupMap.get(key).push(row);
  });

  // 2. Build group objects with summary cells and raw aggregate values
  const groups = groupOrder.map(key => {
    const groupRows = groupMap.get(key);
    const expanded = !!groupExpanded[key];

    const sumCells = new Array(headers.length).fill('');
    const aggValues = {};
    gi.forEach(c => { sumCells[c] = groupRows[0][c] });
    ci.forEach(c => {
      if (numCols.has(c)) {
        sumCells[c] = hasActiveFilters() ? 'FILTER APPLIED' : 'ALL';
      } else {
        const uniqueCount = new Set(groupRows.map(r => String(r[c]).trim())).size;
        sumCells[c] = hasActiveFilters() ? `FILTERED (${uniqueCount})` : `ALL (${uniqueCount})`;
      }
    });
    ni.forEach(c => {
      const vs = groupRows.map(r => parseNum(r[c])).filter(v => !isNaN(v));
      if (vs.length) {
        const agg = S.aggregationMode === 'AVG' ? vs.reduce((a, b) => a + b, 0) / vs.length : vs.reduce((a, b) => a + b, 0);
        aggValues[c] = agg;
        const sample = groupRows.find(r => r[c] && r[c].trim() !== '');
        sumCells[c] = formatAgg(agg, sample ? sample[c] : '');
      }
    });

    return { key, groupRows, expanded, sumCells, aggValues };
  });

  // 3. Sort groups by sortStack
  const collSet = new Set(ci);
  if (sortStack.length) {
    groups.sort((a, b) => {
      for (const s of sortStack) {
        let cmp = 0;
        if (s.col in a.aggValues || s.col in b.aggValues) {
          const av = a.aggValues[s.col] ?? 0, bv = b.aggValues[s.col] ?? 0;
          cmp = av - bv;
        } else if (collSet.has(s.col) && !numCols.has(s.col)) {
          const extract = v => { const m = String(v).match(/\((\d+)\)$/); return m ? parseInt(m[1]) : 0 };
          cmp = extract(a.sumCells[s.col]) - extract(b.sumCells[s.col]);
        } else {
          cmp = cmpCells(s.col, a.sumCells[s.col], b.sumCells[s.col]);
        }
        if (cmp !== 0) return s.dir === 'asc' ? cmp : -cmp;
      }
      return 0;
    });
  }

  // 4. Build output: each group's summary, then sorted detail rows
  const hasNumeric = ni.length > 0;
  const out = [];
  groups.forEach(g => {
    if (!g.expanded || hasNumeric) {
      out.push({ cells: g.sumCells, type: 'summary', groupKey: g.key, expanded: g.expanded });
    }
    if (g.expanded) {
      // Rows that match on every visible collapsible column (e.g. they only
      // differed in a hidden column) are combined, with numbers re-aggregated.
      const subMap = new Map(), subOrder = [];
      g.groupRows.forEach(row => {
        const k = ci.map(c => row[c] ?? '').join('|||');
        if (!subMap.has(k)) { subMap.set(k, []); subOrder.push(k) }
        subMap.get(k).push(row);
      });
      const combined = subOrder.map(k => {
        const rows = subMap.get(k);
        if (rows.length === 1 || !hasNumeric) return [...rows[0]];
        const cells = [...rows[0]];
        ni.forEach(c => {
          const vs = rows.map(r => parseNum(r[c])).filter(v => !isNaN(v));
          if (!vs.length) { cells[c] = ''; return; }
          const agg = S.aggregationMode === 'AVG' ? vs.reduce((a, b) => a + b, 0) / vs.length : vs.reduce((a, b) => a + b, 0);
          const sample = rows.find(r => r[c] && r[c].trim() !== '');
          cells[c] = formatAgg(agg, sample ? sample[c] : '');
        });
        return cells;
      });
      let first = true;
      sortRows(combined).forEach(cells => {
        const entry = { cells, type: 'detail', groupKey: g.key };
        if (!hasNumeric && first) { entry.needsToggle = true; first = false }
        out.push(entry);
      });
    }
  });
  return out;
}

// Format an aggregated number mimicking the source column's format
function formatAgg(num, sampleVal) {
  const s = String(sampleVal);
  const prefixMatch = s.match(/^([€$£¥₹₽₩])/);
  const prefix = prefixMatch ? prefixMatch[1] : '';
  const dotMatch = s.replace(/[^0-9.]/g, '').match(/\.(\d+)$/);
  const decimals = dotMatch ? dotMatch[1].length : 0;
  const formatted = Math.abs(num).toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
  const sign = num < 0 ? '-' : '';
  const label = S.aggregationMode === 'AVG' ? ' (Avg)' : ' (Total)';
  return sign + prefix + formatted + label;
}

// ═══════════════════════════════════════════════════════════════════════════════
//  SUPPRESSION & MERGE SPANS
// ═══════════════════════════════════════════════════════════════════════════════

function isAllCell(v) { const s = String(v); return s === 'ALL' || s.startsWith('ALL (') || s === 'FILTER APPLIED' || s.startsWith('FILTERED (') }

function isSuppressed(rows, ri, ci, prevCols) {
  if (ri === 0) return false;
  if (numCols.has(ci)) return false;
  const cur = rows[ri].cells[ci], prev = rows[ri - 1].cells[ci];
  if (isAllCell(cur)) return false;
  if (cur !== prev) return false;
  for (const c of prevCols) { if (rows[ri].cells[c] !== rows[ri - 1].cells[c]) return false }
  return true;
}

function computeMerges(pageRows) {
  const map = pageRows.map(() => headers.map(() => ({ span: 1 })));
  const vis = visibleColIndices();
  for (let vi = 0; vi < vis.length; vi++) {
    const ci = vis[vi];
    if (numCols.has(ci)) continue;
    const prevCols = vis.slice(0, vi);
    let mergeStart = 0;
    for (let ri = 1; ri < pageRows.length; ri++) {
      if (isSuppressed(pageRows, ri, ci, prevCols)) {
        map[ri][ci] = { skip: true };
        map[mergeStart][ci].span++;
      } else {
        mergeStart = ri;
      }
    }
  }
  return map;
}

// ═══════════════════════════════════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════════════════════════════════

function renderTable() {
  const app = appEl();
  if (!app) return;
  if (!headers.length) return;
  const rpp = rowsPerPage();
  const allRows = buildView();
  const total = allRows.length;
  const pages = Math.max(1, Math.ceil(total / rpp));
  if (currentPage > pages) currentPage = pages;

  const start = (currentPage - 1) * rpp;
  const end = Math.min(start + rpp, total);
  const pageRows = allRows.slice(start, end);

  const hc = hasColl();
  const hBg = S.headerColor, hTx = txtClr(hBg);
  const tBg = S.tableColor;
  const aBg = S.alternateRowColors ? darken(tBg, .08) : tBg;
  const visCols = visibleColIndices();
  const colCount = visCols.length;
  const toggleW = 32;
  const minColW = 100;
  const totalMinW = (colCount * minColW) + (hc ? toggleW : 0);

  const merges = computeMerges(pageRows);

  let o = '';

  // ── Search bar ──
  o += '<div id="tbl-search-bar">';
  o += '<div class="tbl-search">';
  o += '<svg class="tbl-search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
  o += `<input id="tbl-search-input" type="search" placeholder="Search the table…" aria-label="Search the table" autocomplete="off" value="${esc(searchTerm)}" oninput="TBL.onSearch(this.value)" onkeydown="if(event.key==='Escape'){TBL.clearSearch()}">`;
  if (searchTerm) o += '<button class="tbl-search-clear" onclick="TBL.clearSearch()" title="Clear search" aria-label="Clear search">&times;</button>';
  o += '</div></div>';

  // ── Status bar ──
  o += '<div id="status-bar">';
  o += '<div class="left">';
  if (hc) {
    o += '<button class="share-btn" onclick="TBL.expandAll()">Expand all</button>';
    o += '<button class="share-btn" onclick="TBL.collapseAll()">Collapse all</button>';
  }
  const filteredTotal = filterRows(rawRows).length;
  const showing = hasActiveFilters() ? `${filteredTotal.toLocaleString()} of ${rawRows.length.toLocaleString()} rows` :
    `${rawRows.length.toLocaleString()} row${rawRows.length !== 1 ? 's' : ''}`;
  o += `<span>${showing}`;
  if (hc) { const ec = Object.values(groupExpanded).filter(Boolean).length; o += ` &middot; ${ec} group${ec !== 1 ? 's' : ''} expanded` }
  o += '</span></div>';

  o += '<div class="center"></div>';

  o += '<div class="right">';
  const rightParts = [];
  if (S.shareLink) rightParts.push(`<a class="source-link" href="javascript:void(0)" onclick="TBL.copyShare(this)" title="Copy link to clipboard">Share</a>`);
  rightParts.push(`<a class="source-link" href="javascript:void(0)" onclick="TBL.downloadCSV()">Download data</a>`);
  if (S.sourceText) {
    let src = '<span class="source-label">Source:</span>';
    if (S.sourceLink) src += `<a class="source-link" href="${esc(S.sourceLink)}" target="_blank" rel="noopener">${esc(S.sourceText)}</a>`;
    else src += `<span class="source-link">${esc(S.sourceText)}</span>`;
    rightParts.push(src);
  }
  o += rightParts.join('<span class="source-label">&nbsp;&middot;&nbsp;</span>');
  o += '</div></div>';

  // ── Filter bar ──
  o += `<div id="filter-bar" class="${hasActiveFilters() ? 'active' : ''}">`;
  o += '<span>Filters active</span>';
  o += '<button class="clear-filters-btn" onclick="TBL.clearAllFilters()">Clear all filters</button>';
  o += '</div>';

  // ── Button filter bar ──
  const bfCols = activeBtnFilterCols();
  if (bfCols.length > 0) {
    o += '<div id="btn-filter-bar">';
    // Dropdown-style columns first (they sit side by side), then each
    // button-style column on its own line of pills.
    const ddCols = bfCols.filter(h => bfMode(h) === 'dropdown');
    const pillCols = bfCols.filter(h => bfMode(h) === 'buttons');
    ddCols.forEach(hdrName => {
      const bf = btnFilters[hdrName];
      const isActive = bf && bf.size > 0;
      const uniqueCount = btnFilterUniqueVals(hdrName).length;
      const label = isActive ? `${hdrName} (${bf.size}/${uniqueCount})` : hdrName;
      o += `<div class="bf-group" data-bf-hdr="${esc(hdrName)}">`;
      o += `<button class="bf-btn ${isActive ? 'bf-active' : ''}" onclick="TBL.toggleBtnFilter(event,'${esc(hdrName)}')">${esc(label)} <span class="bf-arrow">▼</span></button>`;
      o += `</div>`;
    });
    const pillOnBg = S.headerColor, pillOnTx = txtClr(pillOnBg);
    pillCols.forEach(hdrName => {
      const hci = headers.indexOf(hdrName);
      const vals = btnFilterUniqueVals(hdrName);
      const sel = btnFilters[hdrName];
      const anySel = !!(sel && sel.size);
      const onSty = `background:${pillOnBg};border-color:${pillOnBg};color:${pillOnTx};`;
      const offSty = `background:color-mix(in srgb, ${pillOnBg} 14%, var(--surface));border-color:color-mix(in srgb, ${pillOnBg} 55%, var(--surface));`;
      o += `<div class="bf-pills" role="group" aria-label="${esc(hdrName)}">`;
      o += `<span class="bf-pill-label">${esc(hdrName)}</span>`;
      o += `<button class="bf-pill bf-pill-all ${anySel ? '' : 'on'}" aria-pressed="${!anySel}" style="${anySel ? offSty : onSty}" onclick="TBL.clearPills(${hci})">All</button>`;
      vals.forEach((v, vi) => {
        const on = anySel && sel.has(v);
        o += `<button class="bf-pill ${on ? 'on' : ''}" aria-pressed="${on}" style="${on ? onSty : offSty}" onclick="TBL.togglePill(${hci},${vi})">${esc(v || '(empty)')}</button>`;
      });
      o += `</div>`;
    });
    o += '</div>';
  }

  // ── Chart area outline ──
  o += '<div id="chart-outline">';

  // ── Table ──
  o += '<div id="table-wrapper">';
  o += `<table id="data-table" style="width:100%;min-width:${totalMinW}px;">`;

  o += '<colgroup>';
  if (hc) o += `<col style="width:${toggleW}px;">`;
  for (let i = 0; i < colCount; i++) o += '<col>';
  o += '</colgroup>';

  // ── THEAD ──
  o += `<thead style="font-size:${S.headerFontSize}px;"><tr>`;
  if (hc) o += `<th class="tcol col-sticky" style="background:${hBg};color:${hTx};left:0;"></th>`;

  visCols.forEach((ci) => {
    const hdr = headers[ci];
    let cls = '';
    let sty = `background:${hBg};color:${hTx};`;
    if (S.lockFirstColumn && ci === visCols[0]) { cls += ' col-sticky'; sty += `left:${hc ? toggleW : 0}px;` }

    o += `<th class="${cls}" data-ci="${ci}" style="${sty}">`;
    o += '<div class="th-content">';
    o += `<span class="th-label">${esc(hdr)}</span>`;
    o += '<span class="th-btns">';

    if (S.userCanFilterColumns && !numCols.has(ci) && !btnFilterColSet().has(hdr)) {
      const fActive = filters[ci] && filters[ci].size > 0;
      o += `<button class="filter-btn ${fActive ? 'active-filter' : ''}" onclick="TBL.toggleFilter(event,${ci})" title="Filter this column" aria-label="Filter ${esc(hdr)}"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.6"/><line x1="15.5" y1="15.5" x2="21" y2="21" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/></svg></button>`;
    }

    if (S.userCanSortColumns) {
      const si = sortStack.findIndex(s => s.col === ci);
      const active = si >= 0;
      const dir = active ? sortStack[si].dir : null;
      // Two stacked arrowheads; the active direction is solid, the other faint
      const upOp = dir === 'desc' ? .3 : 1, dnOp = dir === 'asc' ? .3 : 1;
      const arrow = `<svg viewBox="0 0 16 20" width="13" height="16" aria-hidden="true"><path d="M8 1.5 L14 8.5 H2 Z" fill="currentColor" opacity="${upOp}"/><path d="M8 18.5 L14 11.5 H2 Z" fill="currentColor" opacity="${dnOp}"/></svg>`;
      const badge = active && sortStack.length > 1 ? `<span class="sort-badge">${si + 1}</span>` : '';
      const sortLbl = dir === 'asc' ? 'Sorted ascending — click for descending' : dir === 'desc' ? 'Sorted descending — click to clear' : 'Sort';
      o += `<button class="sort-btn ${active ? 'active-sort' : ''}" onclick="TBL.cycleSort(${ci})" title="${sortLbl}" aria-label="${sortLbl}: ${esc(hdr)}">${arrow}${badge}</button>`;
    }

    o += '</span></div></th>';
  });
  o += '</tr></thead>';

  // ── TBODY ──
  toggleGroupSets = [];
  const toggleSetMap = {};
  if (hc) {
    for (let ri = 0; ri < pageRows.length; ri++) {
      const m = merges[ri][visCols[0] ?? 0];
      if (!m.skip) {
        const keys = [];
        for (let r = ri; r < ri + m.span && r < pageRows.length; r++) {
          if (pageRows[r].type === 'summary' || pageRows[r].needsToggle) keys.push(pageRows[r].groupKey);
        }
        if (keys.length) {
          toggleSetMap[ri] = toggleGroupSets.length;
          toggleGroupSets.push(keys);
        }
      }
    }
  }

  o += `<tbody style="font-size:${S.tableFontSize}px;">`;
  pageRows.forEach((row, ri) => {
    const even = ri % 2 === 1;
    const bg = even ? aBg : tBg;
    const tc = txtClr(bg);
    const isSummary = row.type === 'summary';

    o += `<tr data-ri="${ri}" style="background:${bg};color:${tc};">`;

    if (hc) {
      const toggleMerge = merges[ri][visCols[0] ?? 0];
      if (toggleMerge.skip) {
        // merged into the row above
      } else {
        let btn = '';
        if ((isSummary || row.needsToggle) && toggleSetMap[ri] != null) {
          const setIdx = toggleSetMap[ri];
          const setKeys = toggleGroupSets[setIdx];
          const anyExpanded = setKeys.some(k => !!groupExpanded[k]);
          const icon = anyExpanded ? '−' : '+';
          btn = `<button class="tbtn" style="color:${tc};border-color:${tc === C.textLight ? C.overlayBorderLight : C.overlayBorder};" onclick="TBL.toggleGroupSet(${setIdx})">${icon}</button>`;
        }
        const tSpan = toggleMerge.span > 1 ? ` rowspan="${toggleMerge.span}"` : '';
        o += `<td class="tcol col-sticky" data-ci="-1"${tSpan} style="left:0;background:${bg};">${btn}</td>`;
      }
    }

    visCols.forEach((ci) => {
      const m = merges[ri][ci];
      if (m.skip) return;

      const val = row.cells[ci] ?? '';
      const isN = numCols.has(ci);
      const isAgg = isSummary && isN && String(val).includes('(');
      const isAll = isAllCell(val);

      let cls = [];
      if (isAgg) cls.push('agg-cell');
      else if (isN) cls.push('num-cell');
      if (isAll) cls.push('all-cell');

      let sty = '';
      if (m.span > 1) { sty += `background:${bg};`; }

      if (S.lockFirstColumn && ci === visCols[0]) {
        cls.push('col-sticky');
        sty += `left:${hc ? toggleW : 0}px;`;
        if (m.span <= 1) sty += `background:${bg};`;
      }

      const rowspanAttr = m.span > 1 ? ` rowspan="${m.span}"` : '';

      let display = '';
      if (isAgg || isAll) { display = esc(String(val)) }
      else { display = esc(String(val)).replace(/\n/g, '<br>') }

      o += `<td class="${cls.join(' ')}" data-ci="${ci}"${rowspanAttr} style="${sty}">${display}</td>`;
    });

    o += '</tr>';
  });
  o += '</tbody></table></div>';

  // ── Pagination ──
  if (pages > 1) {
    o += '<div id="pag-bar">';
    o += `<button class="pg" ${currentPage === 1 ? 'disabled' : ''} onclick="TBL.goPage(${currentPage - 1})">&#8249;</button>`;
    pagRange(currentPage, pages).forEach(p => {
      if (p === '...') o += '<span class="pgd">&hellip;</span>';
      else o += `<button class="pg ${p === currentPage ? 'pga' : ''}" onclick="TBL.goPage(${p})">${p}</button>`;
    });
    o += `<button class="pg" ${currentPage === pages ? 'disabled' : ''} onclick="TBL.goPage(${currentPage + 1})">&#8250;</button>`;
    o += '</div>';
  }

  o += '</div>'; // close #chart-outline

  const prevSearch = document.getElementById('tbl-search-input');
  const hadFocus = prevSearch && document.activeElement === prevSearch;
  const selStart = hadFocus ? prevSearch.selectionStart : null, selEnd = hadFocus ? prevSearch.selectionEnd : null;
  app.innerHTML = o;
  if (hadFocus) {
    const si = document.getElementById('tbl-search-input');
    if (si) { si.focus(); try { si.setSelectionRange(selStart, selEnd) } catch (e) {} }
  }
  setupHover();
}

function pagRange(cur, tot) {
  if (tot <= 7) return Array.from({ length: tot }, (_, i) => i + 1);
  const p = [1];
  if (cur > 3) p.push('...');
  for (let i = Math.max(2, cur - 1); i <= Math.min(tot - 1, cur + 1); i++) p.push(i);
  if (cur < tot - 2) p.push('...');
  p.push(tot);
  return p;
}

// ═══════════════════════════════════════════════════════════════════════════════
//  HOVER
// ═══════════════════════════════════════════════════════════════════════════════

function setupHover() {
  const table = document.getElementById('data-table');
  if (!table) return;
  let lastRI = null, lastCI = null;

  table.addEventListener('mouseover', e => {
    const td = e.target.closest('td,th');
    if (!td) return;
    const ci = td.getAttribute('data-ci');
    const tr = td.closest('tr');
    const ri = tr ? tr.getAttribute('data-ri') : null;
    if (ci === lastCI && ri === lastRI) return;

    clearHover(table);
    lastRI = ri; lastCI = ci;
    if (ci == null || ci === '-1' || ri == null) return;

    if (ri != null) {
      const row = table.querySelector(`tbody tr[data-ri="${ri}"]`);
      if (row) row.classList.add('row-hover');
    }
    table.querySelectorAll(`tbody td[data-ci="${ci}"]`).forEach(c => c.classList.add('col-hover'));
    const th = table.querySelector(`thead th[data-ci="${ci}"]`);
    if (th) th.classList.add('col-hover');
  });

  table.addEventListener('mouseleave', () => { clearHover(table); lastRI = null; lastCI = null });
}

function clearHover(table) {
  table.querySelectorAll('.row-hover').forEach(el => el.classList.remove('row-hover'));
  table.querySelectorAll('.col-hover').forEach(el => el.classList.remove('col-hover'));
}

// ═══════════════════════════════════════════════════════════════════════════════
//  SORT
// ═══════════════════════════════════════════════════════════════════════════════

function cycleSort(ci) {
  const existing = sortStack.findIndex(s => s.col === ci);
  if (existing < 0) {
    sortStack.unshift({ col: ci, dir: 'asc' });
  } else {
    const cur = sortStack[existing];
    if (cur.dir === 'asc') {
      cur.dir = 'desc';
      sortStack.splice(existing, 1);
      sortStack.unshift(cur);
    } else {
      sortStack.splice(existing, 1);
    }
  }
  currentPage = 1;
  renderTable();
}

// ═══════════════════════════════════════════════════════════════════════════════
//  FILTER
// ═══════════════════════════════════════════════════════════════════════════════

function toggleFilter(event, ci) {
  event.stopPropagation();
  if (openFilter === ci) { closeFilterDropdown(); return }
  closeFilterDropdown();
  closeBtnFilterDropdown();
  openFilter = ci;

  const uniqueVals = uniqueColVals(ci);
  const currentFilter = filters[ci] || new Set();
  const hasFilter = currentFilter.size > 0;

  const btn = event.target.closest('.filter-btn');
  const rect = btn.getBoundingClientRect();
  const wrapper = document.getElementById('table-wrapper');
  const wrapRect = wrapper.getBoundingClientRect();

  const dd = document.createElement('div');
  dd.className = 'filter-dropdown';
  dd.id = 'filter-dd';

  let left = rect.left - wrapRect.left + wrapper.scrollLeft;
  let top = rect.bottom - wrapRect.top + wrapper.scrollTop + 4;
  if (left + 220 > wrapRect.width + wrapper.scrollLeft) left = rect.right - 220 - wrapRect.left + wrapper.scrollLeft;
  dd.style.left = left + 'px';
  dd.style.top = top + 'px';

  const tempSelected = hasFilter ? new Set(currentFilter) : new Set(uniqueVals);

  function renderList(searchTerm) {
    const filtered = searchTerm ? uniqueVals.filter(v => v.toLowerCase().includes(searchTerm.toLowerCase())) : uniqueVals;
    const listEl = dd.querySelector('.fd-list');
    listEl.innerHTML = '';
    filtered.forEach(v => {
      const checked = tempSelected.has(v);
      const item = document.createElement('div');
      item.className = 'fd-item';
      item.innerHTML = `<input type="checkbox" ${checked ? 'checked' : ''} data-val="${esc(v)}"><label>${esc(v || '(empty)')}</label>`;
      item.querySelector('input').addEventListener('change', e => {
        if (e.target.checked) tempSelected.add(v); else tempSelected.delete(v);
      });
      item.querySelector('label').addEventListener('click', () => {
        const cb = item.querySelector('input');
        cb.checked = !cb.checked;
        if (cb.checked) tempSelected.add(v); else tempSelected.delete(v);
      });
      listEl.appendChild(item);
    });
  }

  dd.innerHTML = `
    <div class="fd-search"><input type="text" placeholder="Search values…"></div>
    <div class="fd-list"></div>
    <div class="fd-actions">
      <button onclick="TBL.applyFilter(${ci},'select-all')">Select All</button>
      <button onclick="TBL.applyFilter(${ci},'clear-all')">Clear All</button>
      <button class="fd-apply" onclick="TBL.applyFilter(${ci},'apply')">Apply</button>
    </div>
  `;

  wrapper.style.position = 'relative';
  wrapper.appendChild(dd);

  renderList('');

  const searchInput = dd.querySelector('.fd-search input');
  searchInput.addEventListener('input', e => renderList(e.target.value));
  searchInput.focus();

  dd._tempSelected = tempSelected;
  dd._uniqueVals = uniqueVals;
  dd._renderList = renderList;

  setTimeout(() => {
    document.addEventListener('click', closeFilterOnOutside);
  }, 0);
}

function closeFilterOnOutside(e) {
  const dd = document.getElementById('filter-dd');
  if (dd && !dd.contains(e.target) && !e.target.closest('.filter-btn')) {
    closeFilterDropdown();
  }
}

function closeFilterDropdown() {
  openFilter = null;
  const dd = document.getElementById('filter-dd');
  if (dd) dd.remove();
  document.removeEventListener('click', closeFilterOnOutside);
}

function applyFilter(ci, action) {
  const dd = document.getElementById('filter-dd');
  if (!dd) return;

  if (action === 'select-all') {
    dd._tempSelected.clear();
    dd._uniqueVals.forEach(v => dd._tempSelected.add(v));
    dd._renderList(dd.querySelector('.fd-search input').value);
    return;
  }
  if (action === 'clear-all') {
    dd._tempSelected.clear();
    dd._renderList(dd.querySelector('.fd-search input').value);
    return;
  }
  if (action === 'apply') {
    const sel = dd._tempSelected;
    const all = dd._uniqueVals;
    if (sel.size === all.length || sel.size === 0) {
      delete filters[ci];
    } else {
      filters[ci] = new Set(sel);
    }
    closeFilterDropdown();
    currentPage = 1;
    renderTable();
  }
}

function onSearch(v) {
  searchTerm = v;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { currentPage = 1; renderTable(); }, 150);
}
function clearSearch() {
  clearTimeout(searchTimer);
  searchTerm = '';
  currentPage = 1;
  renderTable();
  const si = document.getElementById('tbl-search-input');
  if (si) si.focus();
}

function clearAllFilters() {
  clearTimeout(searchTimer);
  searchTerm = '';
  filters = {};
  btnFilters = {};
  currentPage = 1;
  renderTable();
}

// ═══════════════════════════════════════════════════════════════════════════════
//  BUTTON FILTERS
// ═══════════════════════════════════════════════════════════════════════════════

// Button-style filter: each click adds/removes one value. Nothing selected = everything shown.
function togglePill(ci, vi) {
  const hdrName = headers[ci];
  if (hdrName == null) return;
  const vals = btnFilterUniqueVals(hdrName);
  const v = vals[vi];
  if (v === undefined) return;
  const set = btnFilters[hdrName] ? new Set(btnFilters[hdrName]) : new Set();
  if (set.has(v)) set.delete(v); else set.add(v);
  if (set.size === 0 || set.size === vals.length) delete btnFilters[hdrName];
  else btnFilters[hdrName] = set;
  currentPage = 1;
  renderTable();
}
function clearPills(ci) {
  const hdrName = headers[ci];
  if (hdrName == null) return;
  delete btnFilters[hdrName];
  currentPage = 1;
  renderTable();
}

function toggleBtnFilter(event, hdrName) {
  event.stopPropagation();
  if (openBtnFilter === hdrName) { closeBtnFilterDropdown(); return }
  closeBtnFilterDropdown();
  closeFilterDropdown();
  openBtnFilter = hdrName;

  const uniqueVals = btnFilterUniqueVals(hdrName);
  const currentFilter = btnFilters[hdrName] || new Set();
  const hasFilter = currentFilter.size > 0;

  const btn = event.target.closest('.bf-btn');
  const group = btn.closest('.bf-group');

  const dd = document.createElement('div');
  dd.className = 'bf-dropdown';
  dd.id = 'bf-filter-dd';

  const tempSelected = hasFilter ? new Set(currentFilter) : new Set(uniqueVals);

  function renderList(searchTerm) {
    const filtered = searchTerm ? uniqueVals.filter(v => v.toLowerCase().includes(searchTerm.toLowerCase())) : uniqueVals;
    const listEl = dd.querySelector('.bfd-list');
    listEl.innerHTML = '';
    filtered.forEach(v => {
      const checked = tempSelected.has(v);
      const item = document.createElement('div');
      item.className = 'bfd-item';
      item.innerHTML = `<input type="checkbox" ${checked ? 'checked' : ''} data-val="${esc(v)}"><label>${esc(v || '(empty)')}</label>`;
      item.querySelector('input').addEventListener('change', e => {
        if (e.target.checked) tempSelected.add(v); else tempSelected.delete(v);
      });
      item.querySelector('label').addEventListener('click', () => {
        const cb = item.querySelector('input');
        cb.checked = !cb.checked;
        if (cb.checked) tempSelected.add(v); else tempSelected.delete(v);
      });
      listEl.appendChild(item);
    });
  }

  dd.innerHTML = `
    <div class="bfd-search"><input type="text" placeholder="Search values…"></div>
    <div class="bfd-list"></div>
    <div class="bfd-actions">
      <button onclick="TBL.applyBtnFilter('${esc(hdrName)}','select-all')">Select All</button>
      <button onclick="TBL.applyBtnFilter('${esc(hdrName)}','clear-all')">Clear All</button>
      <button class="bfd-apply" onclick="TBL.applyBtnFilter('${esc(hdrName)}','apply')">Apply</button>
    </div>
  `;

  group.appendChild(dd);
  renderList('');

  const searchInput = dd.querySelector('.bfd-search input');
  searchInput.addEventListener('input', e => renderList(e.target.value));
  searchInput.focus();

  dd._tempSelected = tempSelected;
  dd._uniqueVals = uniqueVals;
  dd._renderList = renderList;

  setTimeout(() => {
    document.addEventListener('click', closeBtnFilterOnOutside);
  }, 0);
}

function closeBtnFilterOnOutside(e) {
  const dd = document.getElementById('bf-filter-dd');
  if (dd && !dd.contains(e.target) && !e.target.closest('.bf-btn')) {
    closeBtnFilterDropdown();
  }
}

function closeBtnFilterDropdown() {
  openBtnFilter = null;
  const dd = document.getElementById('bf-filter-dd');
  if (dd) dd.remove();
  document.removeEventListener('click', closeBtnFilterOnOutside);
}

function applyBtnFilter(hdrName, action) {
  const dd = document.getElementById('bf-filter-dd');
  if (!dd) return;

  if (action === 'select-all') {
    dd._tempSelected.clear();
    dd._uniqueVals.forEach(v => dd._tempSelected.add(v));
    dd._renderList(dd.querySelector('.bfd-search input').value);
    return;
  }
  if (action === 'clear-all') {
    dd._tempSelected.clear();
    dd._renderList(dd.querySelector('.bfd-search input').value);
    return;
  }
  if (action === 'apply') {
    const sel = dd._tempSelected;
    const all = dd._uniqueVals;
    if (sel.size === all.length || sel.size === 0) {
      delete btnFilters[hdrName];
    } else {
      btnFilters[hdrName] = new Set(sel);
    }
    closeBtnFilterDropdown();
    currentPage = 1;
    renderTable();
  }
}

// ═══════════════════════════════════════════════════════════════════════════════
//  EVENT HANDLERS
// ═══════════════════════════════════════════════════════════════════════════════

function toggleGroupSet(setIdx) {
  const keys = toggleGroupSets[setIdx];
  if (!keys || !keys.length) return;
  const anyExpanded = keys.some(k => !!groupExpanded[k]);
  keys.forEach(k => { groupExpanded[k] = !anyExpanded });
  renderTable();
}
function expandAll() {
  if (!hasColl()) return;
  const gi = groupKeyIdx();
  filterRows(rawRows).forEach(row => {
    const key = gi.map(i => row[i] ?? '').join('|||');
    groupExpanded[key] = true;
  });
  currentPage = 1; renderTable();
}
function collapseAll() { groupExpanded = {}; currentPage = 1; renderTable() }

function copyShare(btn) {
  navigator.clipboard.writeText(S.shareLink).then(() => {
    const orig = btn.textContent;
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.textContent = orig }, 1500);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = S.shareLink; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
    const orig = btn.textContent;
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.textContent = orig }, 1500);
  });
}

function downloadCSV() {
  const csvEsc = v => { const s = String(v); return s.includes(',') || s.includes('"') || s.includes('\n') ? '"' + s.replace(/"/g, '""') + '"' : s };
  const keep = headers.map((_, i) => i).filter(i => !isHiddenCi(i));
  const lines = [keep.map(i => csvEsc(headers[i])).join(',')];
  rawRows.forEach(r => { lines.push(keep.map(i => csvEsc(r[i] ?? '')).join(',')) });
  const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = sanitizeFilename(state.name || 'data') + '.csv'; a.style.display = 'none';
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

function goPage(p) {
  const allRows = buildView();
  const tot = Math.max(1, Math.ceil(allRows.length / rowsPerPage()));
  if (p < 1 || p > tot) return;
  currentPage = p; renderTable();
  const tw = document.getElementById('table-wrapper'); if (tw) tw.scrollTop = 0;
}

// ═══════════════════════════════════════════════════════════════════════════════
//  LOAD / REFRESH / SHOW-HIDE / BOOT
// ═══════════════════════════════════════════════════════════════════════════════

function showError(t, m) { const app = appEl(); if (app) app.innerHTML = `<div id="err-screen"><h2>${t}</h2><p>${m}</p></div>` }
function showLoading() { const app = appEl(); if (app) app.innerHTML = '<div id="load-screen"><div class="spin"></div>Loading&hellip;</div>' }

// Ingest raw CSV text: parse, detect columns and render. If the column
// headers changed, volatile UI state (filters/sorts/expansion) is reset.
function ingest(text) {
  lastCSVText = text;
  const parsed = parseCSV(text);
  const newHeaders = (parsed.headers || []).map(h => h.trim());
  const sameHeaders = headers.length > 0 && newHeaders.length === headers.length && newHeaders.every((h, i) => h === headers[i]);
  headers = newHeaders;
  rawRows = parsed.rows;
  if (!headers.length || !rawRows.length) { showError('Empty Data', 'The data source returned no rows.'); return }
  detectNumCols();
  if (!sameHeaders) { filters = {}; btnFilters = {}; searchTerm = ''; sortStack = []; groupExpanded = {}; applyBtnDefaults(); }
  currentPage = 1;
  if (!sameHeaders && !S.defaultToCollapsedColumns && hasColl()) {
    const gi = groupKeyIdx();
    rawRows.forEach(row => {
      const key = gi.map(i => row[i] ?? '').join('|||');
      groupExpanded[key] = true;
    });
  }
  renderTable();
  if (typeof window.__onTableDataLoaded === 'function') window.__onTableDataLoaded();
}

// Full (re)load from the current connection (sheet fetch or CSV snapshot).
async function load() {
  showLoading();
  try {
    let text;
    if (state.source === 'csv') {
      text = state.csvText;
      if (!text) throw new Error('No uploaded CSV data. Use the connection screen to upload a CSV.');
    } else {
      if (!state.url) throw new Error('No Google Sheet connected.');
      let u = toCSVUrl(state.url);
      u += (u.includes('?') ? '&' : '?') + '_=' + Date.now(); // cache-buster
      const resp = await fetch(u);
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      text = await resp.text();
      if (text.trimStart().startsWith('<!') || text.trimStart().startsWith('<html'))
        throw new Error('Got a web page instead of CSV — share the sheet as "Anyone with the link can view".');
    }
    ingest(text);
  } catch (err) {
    console.error(err);
    showError('Failed to Load', `Error: <em>${esc(err.message)}</em><br><br>Check the connection and sharing settings.`);
  }
}

// Refresh the live Google Sheets connection (no-op for CSV mode).
async function refresh() {
  if (state.source !== 'sheets') { await load(); return; }
  try {
    let u = toCSVUrl(state.url);
    u += (u.includes('?') ? '&' : '?') + '_=' + Date.now();
    const resp = await fetch(u);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const text = await resp.text();
    if (text.trimStart().startsWith('<!') || text.trimStart().startsWith('<html'))
      throw new Error('Got a web page instead of CSV — check sharing settings.');
    ingest(text);
  } catch (err) {
    alert('Refresh failed: ' + err.message);
  }
}

// Show/hide the table component (swaps with the mapper's #wrap).
function show() {
  const w = document.getElementById('wrap'); if (w) w.style.display = 'none';
  const xr = document.getElementById('exprows-root'); if (xr) xr.style.display = 'none';
  const tr = document.getElementById('table-root'); if (tr) tr.style.display = 'flex';
}
function hide() {
  const tr = document.getElementById('table-root'); if (tr) tr.style.display = 'none';
  const xr = document.getElementById('exprows-root'); if (xr) xr.style.display = 'none';
  const w = document.getElementById('wrap'); if (w) w.style.display = 'flex';
}

// Boot from a saved-file data object ({tool:'table', ...}).
function bootEmbedded(data) {
  if (!data) return;
  if (data.settings) Object.assign(S, data.settings);
  state.source = data.source || 'sheets';
  state.url = data.url || '';
  state.csvText = data.csv || '';
  state.name = data.title || 'Table';
  document.title = state.name;
  show();
  load();
}

// Standalone table export: viewer boot stored the embedded data on window.
if (window.__embeddedChartData && window.__embeddedChartData.tool === 'table') {
  bootEmbedded(window.__embeddedChartData);
}

return {
  S, state,
  headers: () => headers.slice(),
  hasData: () => headers.length > 0,
  rerender: renderTable,
  load, refresh, show, hide, bootEmbedded,
  // inline onclick handlers
  expandAll, collapseAll, copyShare, downloadCSV, clearAllFilters,
  toggleBtnFilter, togglePill, clearPills, onSearch, clearSearch,
  uniqueVals: btnFilterUniqueVals,
  csvSnapshot: () => lastCSVText,
  applyBtnDefault: (h) => { applyBtnDefaults(h); currentPage = 1; renderTable(); }, toggleFilter, cycleSort, toggleGroupSet, goPage,
  applyFilter, applyBtnFilter,
};
})();

</script>
<script id="exprows-viewer-script">
/************************************************************************
 * EXPANDABLE ROWS VIEWER CORE (shared by tool AND standalone export)
 * Structured like the table core (TBL): settings live in EXP.S, are
 * edited via the Options panel (authoring only) and stored in saved
 * HTML files. UI callbacks are exposed on the EXP namespace so inline
 * onclick handlers keep working without polluting globals.
 *
 * Data model: column 1 of the connected sheet/CSV becomes a colored,
 * clickable header row per distinct value; the remaining columns show
 * underneath it when expanded. Sub-columns are laid out with flex-wrap,
 * so columns that don't fit spill onto a new line with their header
 * labels repeated (responsive "spill" behavior).
 ************************************************************************/
const EXP = (function () {

const DEFAULT_ROW_COLOR = '#FFD241';   // DeSmog Yellow

// Header / sub-column size presets (font px + header padding)
const SIZE_HEADER = {
  small:  { font: 13, pad: '7px 12px'  },
  medium: { font: 16, pad: '10px 14px' },
  large:  { font: 20, pad: '13px 16px' },
};
const SIZE_SUB = {
  small:  { label: 9.5,  val: 11.5 },
  medium: { label: 11,   val: 13.5 },
  large:  { label: 12.5, val: 16   },
};

// ─── RUNTIME SETTINGS (edited via Options panel, saved in exports) ───────────
const S = {
  rowColors: {},               // { <first-column value>: '#RRGGBB' } — missing = DeSmog Yellow
  startExpanded: false,        // starting condition: fully expanded / fully collapsed
  headerSize: 'medium',        // 'small' | 'medium' | 'large'
  subSize: 'medium',           // 'small' | 'medium' | 'large'
  columnAlignment: 'left',     // 'left' | 'center' | 'right' (sub-columns only)
  shortNumbers: true,          // 12,100,000 -> 12.1M (mapper-style short form)
  sourceText: '', sourceLink: '', shareLink: '',
};

// ─── CONNECTION STATE ─────────────────────────────────────────────────────────
const state = { source: 'sheets', url: '', csvText: '', name: '' };

let headers = [], rawRows = [], numCols = new Set(), colFormat = {}, expanded = {};

// ═══════════════════════════════════════════════════════════════════════════════
//  UTILITIES (kept local, mirroring the table core's helpers)
// ═══════════════════════════════════════════════════════════════════════════════

function parseNum(v) {

// ═══════════════════════════════════════════════════════════════════════════════
//  CSV PARSER (same as the table tool's)
// ═══════════════════════════════════════════════════════════════════════════════

function parseCSV(text) {

  for (let i = 0; i < text.length; i++) {
    const c = text[i], n = text[i + 1];

    else {

// ═══════════════════════════════════════════════════════════════════════════════
//  COLUMN TYPE / FORMAT DETECTION (table-tool interpretation of numbers +
//  currency: a column is numeric if ≥90% of its non-empty cells parse, and
//  the currency prefix / decimal count is inferred from a sample cell)
// ═══════════════════════════════════════════════════════════════════════════════

function detectNumCols() {

// Mapper-style short form: 12,100,000 -> 12.1M, 100,500 -> 100.5k
function shortForm(value, prefix) {

function displayVal(ci, raw) {

    const n = parseNum(s);
    if (!isNaN(n)) {
      const f = colFormat[ci] || { prefix: '', decimals: 0 };
      if (S.shortNumbers && Math.abs(n) >= 1000) {
        const sign = n < 0 ? '-' : '';
        return sign + shortForm(Math.abs(n), f.prefix);
      }
      const sign = n < 0 ? '-' : '';

    }

// ═══════════════════════════════════════════════════════════════════════════════
//  GROUPING — one group per distinct first-column value, in source order.
//  If the same value appears on several source rows, each source row gets
//  its own sub-row block under the shared header.
// ═══════════════════════════════════════════════════════════════════════════════

function buildGroups() {
  const map = new Map(), order = [];
  rawRows.forEach(r => {
    const key = String(r[0] ?? '').trim();
    if (!map.has(key)) { map.set(key, []); order.push(key); }
    map.get(key).push(r);
  });

function rowColor(key) {
  const c = S.rowColors && S.rowColors[key];
  return (c && /^#[0-9a-fA-F]{3,8}$/.test(c)) ? c : DEFAULT_ROW_COLOR;
}

// ═══════════════════════════════════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════════════════════════════════

function render() {
  const app = appEl();
  if (!app || !headers.length) return;

  const groups = buildGroups();
  lastGroupOrder = groups.map(g => g.key);
  const hz = SIZE_HEADER[S.headerSize] || SIZE_HEADER.medium;
  const sz = SIZE_SUB[S.subSize] || SIZE_SUB.medium;
  const align = ['left', 'center', 'right'].includes(S.columnAlignment) ? S.columnAlignment : 'left';

  let o = '';

  // ── Status bar (mirrors the table tool's) ──
  o += '<div class="status-bar">';
  o += '<div class="left">';
  o += '<button class="share-btn" onclick="EXP.expandAll()">Expand all</button>';
  o += '<button class="share-btn" onclick="EXP.collapseAll()">Collapse all</button>';
  const ec = groups.filter(g => !!expanded[g.key]).length;
  o += `<span>${groups.length.toLocaleString()} row${groups.length !== 1 ? 's' : ''} &middot; ${ec} expanded</span>`;
  o += '</div>';
  o += '<div class="right">';
  const rightParts = [];
  if (S.shareLink) rightParts.push('<a class="source-link" href="javascript:void(0)" onclick="EXP.copyShare(this)" title="Copy link to clipboard">Share</a>');
  rightParts.push('<a class="source-link" href="javascript:void(0)" onclick="EXP.downloadCSV()">Download data</a>');
  if (S.sourceText) {
    let src = '<span class="source-label">Source:</span>';
    if (S.sourceLink) src += `<a class="source-link" href="${esc(S.sourceLink)}" target="_blank" rel="noopener">${esc(S.sourceText)}</a>`;
    else src += `<span class="source-link">${esc(S.sourceText)}</span>`;
    rightParts.push(src);
  }

  o += '</div></div>';

  o += '<div class="exp-scroll"><div class="exp-list">';

    const isOpen = !!expanded[g.key];

    o += '<div class="exp-group">';
    o += `<div class="exp-header" style="background:${bg};color:${tc};font-size:${hz.font}px;padding:${hz.pad};" onclick="EXP.toggle(${gi})" role="button" aria-expanded="${isOpen}">`;
    o += `<span class="exp-header-label">${sanitizeHTML(g.key)}</span>`;
    o += `<span class="tbtn" style="border-color:${bc};" aria-hidden="true">${isOpen ? '−' : '+'}</span>`;
    o += '</div>';
    if (isOpen) {
      o += '<div class="exp-body">';

        o += `<div class="exp-cells" style="text-align:${align};">`;

          o += `<div class="exp-cell-label" style="font-size:${sz.label}px;">${esc(headers[ci])}</div>`;

// ═══════════════════════════════════════════════════════════════════════════════
//  EXPAND / COLLAPSE
// ═══════════════════════════════════════════════════════════════════════════════

function toggle(gi) {

// ═══════════════════════════════════════════════════════════════════════════════
//  SHARE / DOWNLOAD (mirrors the table tool)
// ═══════════════════════════════════════════════════════════════════════════════

function copyShare(btn) {

function downloadCSV() {

function showError(t, m) { const app = appEl(); if (app) app.innerHTML = `<div class="err-screen"><h2>${t}</h2><p>${m}</p></div>` }

    } else {
      if (!state.url) throw new Error('No Google Sheet connected.');
      let u = toCSVUrl(state.url);
      u += (u.includes('?') ? '&' : '?') + '_=' + Date.now(); // cache-buster

      text = await resp.text();

    }
    ingest(text);

    console.error(err);

// Refresh the live Google Sheets connection (no-op for CSV mode).
async function refresh() {
  if (state.source !== 'sheets') { await load(); return; }
  try {
    let u = toCSVUrl(state.url);
    u += (u.includes('?') ? '&' : '?') + '_=' + Date.now();
    const resp = await fetch(u);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const text = await resp.text();
    if (text.trimStart().startsWith('<!') || text.trimStart().startsWith('<html'))
      throw new Error('Got a web page instead of CSV — check sharing settings.');
    ingest(text);
  } catch (err) {
    alert('Refresh failed: ' + err.message);
  }

// Show/hide the component (swaps with the mapper's #wrap and the table root).
function show() {
  const w = document.getElementById('wrap'); if (w) w.style.display = 'none';
  const tr = document.getElementById('table-root'); if (tr) tr.style.display = 'none';
  const xr = document.getElementById('exprows-root'); if (xr) xr.style.display = 'flex';
}
function hide() {
  const xr = document.getElementById('exprows-root'); if (xr) xr.style.display = 'none';
}

// Boot from a saved-file data object ({tool:'exprows', ...}).
function bootEmbedded(data) {

  if (!S.rowColors || typeof S.rowColors !== 'object') S.rowColors = {};

// Standalone export: viewer boot stored the embedded data on window.

  } catch (e) { __expEmbedded = null; }
}
if (__expEmbedded && __expEmbedded.tool === 'exprows') {
  bootEmbedded(__expEmbedded);
}

  S, state,
  headers: () => headers.slice(),
  groupNames,
  hasData: () => headers.length > 0,
  rerender: render,
  load, refresh, show, hide, bootEmbedded,

  toggle, expandAll, collapseAll, copyShare, downloadCSV,
