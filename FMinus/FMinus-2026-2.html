<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <title>DSFM-2</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap');
    
    :root {
      --white: #FFFFFF;
      --light-grey:  #d8d8d8;
      --panel-grey: #C2C2C2;
      --shadow-grey: #9E9E9E;
      --near-black: #383838;
      --text-black: #020202;
      --light-yellow: #FFEDB4;
      --main-yellow: #FFD241;
      --shadow-yellow: #DEB555;
      --error-red: #dc2626;
      --font-family: 'Rubik', Arial, Helvetica, sans-serif;
    }
    
    html,body { 
      width:100%;
      height: 100vh;
      margin:0; 
      font-family: var(--font-family); 
      background:var(--white); 
      align-items: center;
      justify-content: center;
    }
    html, body {overscroll-behavior: none;}

    #wrap { display:flex; width:100%; height:100%; overflow:hidden; }

    /* GRAPH AREA */
    #graph-area { position:relative; flex:1; background:var(--white); }
    canvas { width:100%; height:100%; display:block; background:var(--white); }

    /* LOGO */
    #logo {
      position: absolute;
      bottom: 6px;
      right: 22px;
      z-index: 10;
      opacity: 1;
      pointer-events: none;
    }
    
    #logo img {
      height: 55px;
      width: auto;
    }

    /* Legend styles */
    #legend-container {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      max-width: 96%;
      max-height: 30vh;
      overflow-y: auto;
      display: flex;
      flex-wrap: wrap;
      gap: 4px 6px;
      justify-content: center;
      align-items: center;
      padding: 5px 10px;
      background: rgba(255, 255, 255, 0.95);
      border: 0px solid var(--panel-grey);
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      z-index: 102;
      transition: max-height 0.3s ease, padding 0.3s ease, opacity 0.3s ease;
    }

    #legend-container.collapsed {
      max-height: 0;
      padding: 0 12px;
      opacity: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 2px 5px;
      border-radius: 4px;
      cursor: pointer;
      transition: box-shadow 0.2s ease, opacity 0.2s ease;
      font-size: 12px;
      font-weight: 500;
      user-select: none;
      line-height: 1.2;
    }

    .legend-item:hover {
      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    }

    .legend-item.inactive {
      opacity: 0.4;
    }

    .legend-color-box {
      width: 8px;
      height: 8px;
      border-radius: 8px;
      border: 1px solid rgba(0,0,0,0.2);
      flex-shrink: 0;
    }

    /* Shape Legend Container */
    #shape-legend-container {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      max-width: 96%;
      max-height: 30vh;
      overflow-y: auto;
      display: flex;
      flex-wrap: wrap;
      gap: 4px 6px;
      justify-content: center;
      align-items: center;
      padding: 5px 10px;
      background: rgba(255, 255, 255, 0.95);
      border: 0px solid var(--panel-grey);
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      z-index: 100;
    }

    .shape-legend-item {
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 2px 5px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
      user-select: none;
      line-height: 1.2;
    }

    .shape-legend-icon {
      font-size: 18px;
      flex-shrink: 0;
      line-height: 1;
    }

    #legend-toggle {
      display: none;
      position: absolute;
      justify-content: center;
      align-items: center;
      padding: 4px;
      border: 1px solid var(--near-black);
      top: 12px;
      right: 12px;
      height: 20px;
      width: 20px;
      background: var(--white);
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      z-index: 101;
      user-select: none;
      transition: all 0.2s;
      color: var(--text-black);
      line-height: 28px; 
    }

    #legend-toggle:hover {
      background: rgba(255, 255, 255, 1);
      background-color: var(--light-yellow);
    }

    #legend-toggle-icon {
      display: flex;
      transition: transform 0.3s ease;
      transform: rotate(90deg);
    }

    #legend-toggle-icon.collapsed {
      transform: rotate(90deg);
    }

    /* Mobile view adjustments */
    @media (max-width: 768px) {
      #legend-toggle {
        display: block;
      }
      
      #legend-container {
        left: auto;
        right: 10px;
        transform: none;
        padding-top: 10px;
        justify-content: flex-start;
      }
      
      #legend-container.collapsed {
        padding-top: 0;
      }
    }

    /* TOP CONTROLS - ZOOM */
    #top-controls {
      position: absolute;
      top: 12px;
      left: 12px;
      display: flex;
      gap: 12px;
      z-index: 10;
    }

    #zoom-controls {
      display: flex;
      gap: 8px;
    }
    
    .zoom-btn {
      height: 28px;
      width: 28px;
      border-radius: 20px;
      border: none;
      cursor: pointer;
      background: var(--white);
      color: var(--text-black);
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-family);
      border: 1px solid var(--near-black);
    }
    
    .zoom-btn:hover {
      background: var(--light-yellow);
    }
    
    #fullscreen-btn {
      height: 28px;
      width: 28px;
      border-radius: 20px;
      border: none;
      cursor: pointer;
      background: var(--white);
      color: var(--text-black);
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-family);
      border: 1px solid var(--near-black);
    }
    
    #fullscreen-btn:hover {
      background: var(--light-yellow);
    }

    #share-btn {
      height: 28px;
      width: 28px;
      border-radius: 20px;
      border: none;
      cursor: pointer;
      background: var(--white);
      color: var(--text-black);
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-family);
      border: 1px solid var(--near-black);
    }
    
    #share-btn:hover {
      background: var(--light-yellow);
    }

    #chart-title {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 101;
      font-size: 22px;
      font-weight: 700;
      color: var(--text-black);
      pointer-events: none;
      text-shadow: 0 1px 3px rgba(255,255,255,0.7);
      white-space: nowrap;
    }

    #chart-subtitle {
      position: absolute;
      top: 34px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 101;
      font-size: 14px;
      font-weight: 400;
      color: var(--text-black);
      pointer-events: none;
      text-shadow: 0 1px 3px rgba(255,255,255,0.7);
      white-space: nowrap;
    }

    /* INFO PANEL (RIGHT) */
    #info-panel {
      display: none;
      width: clamp(220px, 28vw, 420px);
      min-width: 200px;  
      max-width: 420px;
      height: 100vh;
      background: var(--white);
      color: var(--text-black);
      padding: clamp(8px, 1.2vw, 16px) clamp(10px, 1.5vw, 20px) clamp(8px, 1.2vw, 16px) clamp(8px, 1vw, 12px);
      box-sizing: border-box;
      flex-direction: column;
      border-left: 1px solid var(--white);
      font-size: clamp(12px, 1.1vw, 15px);
      overflow: hidden;
      transition: width 0.3s ease, min-width 0.3s ease, max-width 0.3s ease, padding 0.3s ease;
      position: relative;
    }
    
    #controls { 
      display: flex; 
      gap: 8px; 
      align-items: center; 
      flex-shrink: 0; 
      margin-bottom: 8px;
    }
    #search-box { display: flex; width: 100%; gap: 6px; flex-wrap: wrap; }
    #search-input { 
      flex: 1; 
      min-width: 0;
      padding: 6px 8px; 
      border-radius: 4px; 
      border: 1px solid var(--shadow-grey); 
      background: rgba(255,255,255,0.5); 
      color: var(--text-black);
      font-family: var(--font-family); 
    }
    #search-btn { 
      height: 29px;
      padding: 1px 8px; 
      border-radius: 4px; 
      border: none; 
      cursor: pointer; 
      background: var(--main-yellow); 
      color: var(--text-black);
      font-family: var(--font-family);
      flex-shrink: 0;
      font-size: 18px;
      white-space: nowrap;
    }
    #clear-btn { 
      height: 29px;
      padding: 6px 6px; 
      border-radius: 4px; 
      border: none; 
      cursor: pointer; 
      background: var(--main-yellow); 
      color: var(--text-black);
      font-family: var(--font-family);
      flex-shrink: 0;
      white-space: nowrap;
      font-weight: bold;
    }
    
    #search-btn:hover, #clear-btn:hover {
      background: var(--light-yellow);
    }
    
    /* Hide search buttons in story mode */
    .story-mode-hide {
      display: none !important;
    }

    #suggestions { 
      background: rgba(255,255,255,0.5); 
      border: 1px solid var(--shadow-grey); 
      max-height: 160px; 
      overflow: auto; 
      display: none; 
      padding: 6px; 
      border-radius: 4px; 
    }
    .suggestion { 
      padding: 6px; 
      cursor: pointer; 
      border-bottom: 1px dashed var(--shadow-grey); 
    }
    .suggestion:hover { 
      background: var(--light-yellow); 
    }

    #node-info { 
      margin-top: 0px; 
      margin-bottom: 6px; 
      padding-left: 6px; 
      padding-right: 6px; 
      background: var(--white); 
      border-radius: 6px; 
      flex-shrink: 0;
    }
    #node-title { 
      font-weight: 700; 
      margin-top: 8px;
      font-size: clamp(13px, 1.1vw, 16px);
    }
    .muted { color: var(--shadow-grey); font-weight: 700; }

    #node-links {
      margin-top: 6px;
      flex-shrink: 0;
    }

    #connections-box {
      margin-top: 4px;
      background: var(--white);
      border-radius: 6px;
      padding: 6px;
      overflow: auto;
      border: 1px solid var(--shadow-grey);
      flex: 1;
      min-height: 2;
    }
    .conn-item {
      padding: clamp(4px, 0.5vw, 6px);
      cursor: pointer;
      font-size: clamp(12px, 1vw, 14px);
      color: var(--text-black);
      border-bottom: 1px dashed var(--shadow-grey);
    }
    .conn-item:hover { 
      background: var(--light-yellow); 
    }

    #msg { margin-top: 6px; color: var(--error-red); font-size: 14px; min-height: 18px; }

    /* MOBILE RESPONSIVE - HORIZONTAL BOTTOM PANEL */
    @media (max-width: 700px) {
      #wrap {
        flex-direction: column;
      }
      
      #graph-area {
        flex: 1;
        height: auto;
        max-height: 60vh;
      }
      
      #info-panel {
        width: 100%;
        min-width: 100%;
        max-width: 100%;
        height: 40vh;
        padding: 12px;
        border-left: none;
        border-top: 2px solid var(--shadow-grey);
        grid-template-columns: 1fr auto;
        grid-template-rows: auto auto auto auto auto 1fr auto;
        gap: 2px;
      }
      
      /* Row 1: Controls + Story button */
      #controls {
        grid-column: 1 / 2;
        grid-row: 1;
        margin-bottom: 0;
      }
      
      #search-box {
        display: flex;
        gap: 3px;
      }
      
      #search-input {
        flex: 1;
        min-width: 40px;
        font-size: 12px;
        padding: 4px 6px;
      }
      
      #search-btn {
        height: 29px;
        padding: 0px 6px;
        font-size: 16px;
      }
      
      #clear-btn {
        height: 29px;
        padding: 6px 6px;
        font-size: 11px;
      }
      
      #story-btn {
        height: 29px;
        grid-column: 2;
        grid-row: 1;
        width: auto !important;
        margin: 0 !important;
        padding: 6px 6px !important;
        font-size: 11px !important;
        align-self: start;
      }
      
      /* Row 2: Suggestions */
      #suggestions {
        grid-column: 1 / -1;
        grid-row: 2;
      }
      
      /* Row 3: Story view content */
      #view-content {
        grid-column: 1 / -1;
        grid-row: 2;
      }
      
      /* Row 4: Node info (title/description) */
      #node-info {
        grid-column: 1 / -1;
        grid-row: 3;
      }
      
      #node-title {
        font-size: 13px;
        grid-row: 2;
      }
      
      /* Row 5: Node links label */
      #node-links {
        grid-column: 1 / -1;
        grid-row: 4;
      }
      
      /* Row 6: Connections box (flexible/scrollable) */
      #connections-box {
        grid-column: 1 / -1;
        grid-row: 4;
        overflow: auto;
        min-height: 2px;
      }
      
      /* Row 7: Message */
      #msg {
        grid-column: 1 / -1;
        grid-row: 7;
      }
      
      #logo {
        bottom: 12px;
        right: 12px;
      }
      
      #logo img {
        height: 40px;
      }
    }

    /* LOADING OVERLAY */
    #loading-overlay {
      position: fixed;
      left: 0;
      top: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
      background: rgba(250,250,250,0.9);
      z-index: 99999;
      font-size: 16px;
      color: var(--text-black);
    }
    .spinner {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 8px solid var(--shadow-grey);
      border-left-color: var(--main-yellow);
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }


    /* STORY MODE BUTTONS */
    #story-btn {
      height: 29px;
      padding: 6px 6px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      background: var(--main-yellow);
      color: black;
      font-family: var(--font-family);
      font-weight: bold;
      flex-shrink: 0;
      white-space: nowrap;
      margin-bottom: 8px;
      width: 100%;
      display: none;
      animation: outlinePulse 2s ease-in-out infinite;
    }
    
    @media (max-width: 768px) {
      #story-btn {
        width: auto;
      }
    }

    #story-btn:hover {
      background: var(--light-yellow);
    }

    #story-nav-container {
      display: none;
      gap: 4px;
      margin-bottom: 14px;
      flex-shrink: 0;
    }

    #story-nav-container.active {
      display: flex;
    }

    .story-nav-btn {
      padding: 6px 8px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      background: var(--main-yellow);
      color: black;
      font-family: var(--font-family);
      font-weight: bold;
      font-size: 13px;
      white-space: nowrap;
      flex: 1;
    }

    .story-nav-btn:hover:not(:disabled) {
      background: var(--light-yellow);
    }

    .story-nav-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .exit-story-nav-btn {
      padding: 6px 8px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      background: var(--panel-grey);
      color: black;
      font-family: var(--font-family);
      font-weight: bold;
      font-size: 13px;
      white-space: nowrap;
      flex: 1;
    }

    .exit-story-nav-btn:hover:not(:disabled) {
      background: var(--light-grey);
    }

    .exit-story-nav-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    @keyframes outlinePulse {
      0%, 100% { 
        outline: 0px solid var(--main-yellow);
        outline-offset: 0px;
        opacity: 1;
      }
      50% { 
        outline: 0px solid var(--light-yellow);
        outline-offset: 0px;
        opacity: 0.8;
      }
    }

    /* ENTITY MODAL IN STORY MODE */
    #entity-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--panel-grey);
      z-index: 1000;
      display: none;
      flex-direction: column;
      padding: 12px;
      box-sizing: border-box;
    }

    #entity-modal.active {
      display: flex;
    }

    #entity-modal-close {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 28px;
      height: 28px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      background: var(--error-red);
      color: white;
      font-family: var(--font-family);
      font-weight: bold;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1001;
    }

    #entity-modal-close:hover {
      background: #b91c1c;
    }

    #entity-modal-content {
      flex: 1;
      overflow: auto;
      margin-top: 8px;
    }

    /* VIEW CONTENT STYLES */
    #view-content {
      display: none;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }

    #view-content.active {
      display: flex;
    }
    #view-content {
      display: none;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }

    #view-content.active {
      display: block;
    }

    .view-title {
      font-size: 28px;
      font-weight: 700;
      margin-top: 12px;
      margin-bottom: 12px;
      color: var(--text-black);
    }

    .view-progress {
      font-size: 13px;
      font-weight: 700;
      color: var(--shadow-grey);
      margin-top: 4px;
    }

    .view-image {
      width: 100%;
      max-width: 100%;
      height: auto;
      border-radius: 6px;
      margin-bottom: 12px;
      object-fit: contain;
    }

    .view-text {
      font-size: 16px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
      flex: 1;
      overflow-y: auto;
      padding-bottom: 12px;
      min-height: 0;
    }

    /* Story mode MOBILE adjustments */
    @media (max-width: 768px) {
      .view-title {
        font-size: 20px !important;
        margin-top: 6px !important;
        margin-bottom: 6px !important;
      }
      
      .view-text {
        font-size: 14px !important;
        line-height: 1.4 !important;
        padding-bottom: 6px !important;
      }
      
      .view-image {
        display: none !important;
      }
      
      #story-nav-container {
        margin-bottom: 6px !important;
        gap: 3px !important;
      }
      
      .story-nav-btn {
        padding: 6px 7px !important;
        font-size: 11px !important;
      }

      .exit-story-nav-btn {
        padding: 6px 7px !important;
        font-size: 11px !important;
      }
    }

    /* ══════════════════ TABLE TOOL STYLES (scoped to #table-root) ══════════════════ */
    #table-root{
      /* Page */
      --page-bg:         #FFFFFF;
      --text-primary:    #1a1a1a;
      /* Surfaces */
      --surface:         #fff;
      --surface-hover:   #f0f0f0;
      /* Borders */
      --border:          #ddd;
      --border-strong:   #ccc;
      --border-light:    #eee;
      /* Text hierarchy */
      --text-secondary:  #434343;
      --text-muted:      #646464;
      --text-faint:      #777777;
      /* Dark accent */
      --accent-dark:     #222;
      --accent-dark-hover:#444;
      /* Danger / error */
      --danger:          #c00;
      --danger-light:    #fee;
      /* Warning / filter bar */
      --warning-bg:      #fffbe6;
      --warning-border:  #e8dfa0;
      /* Highlight (hover crosshair) */
      --highlight:       rgba(200, 190, 100, 0.225);
      /* Table cell borders */
      --cell-border:     #d3d3d3;
      /* Header borders */
      --th-border:rgba(0,0,0,.12);
      /* Semi-transparent overlays */
      --overlay-light:   rgba(0,0,0,.08);
      --overlay-shadow:  rgba(0,0,0,.15);
      --overlay-border:  rgba(0,0,0,.18);
      --btn-bg:          rgba(255,255,255,.35);
      --btn-bg-hover:    rgba(255,255,255,.7);
      --transparent:     rgba(255,255,255,.0);

      position:fixed;inset:0;z-index:1;display:none;flex-direction:column;
      font-family:'Rubik',system-ui,sans-serif;background:var(--page-bg);color:var(--text-primary);
    }
    #table-root *,#table-root *::before,#table-root *::after{box-sizing:border-box;margin:0;padding:0}
    #table-root #table-app{display:flex;flex-direction:column;height:100vh;overflow:hidden;flex:1}

    /* ── Status bar ── */
    #table-root #status-bar{
      display:flex;align-items:center;justify-content:space-between;
      padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--page-bg);
      font-size:12px;color:var(--text-muted);flex-shrink:0;gap:12px;
    }
    #table-root #status-bar .left{display:flex;align-items:center;gap:8px}
    #table-root #status-bar .center{display:flex;align-items:center;gap:8px}
    #table-root #status-bar .right{display:flex;align-items:center;gap:8px}
    #table-root .share-btn{
      padding:3px 10px;border:1px solid var(--border-strong);border-radius:4px;background:var(--surface);
      font-family:inherit;font-size:11px;cursor:pointer;color:var(--text-secondary);text-decoration:none;
      transition:background .1s;
    }
    #table-root .share-btn:hover{background:var(--surface-hover)}
    #table-root .source-link{font-size:11px;color:var(--text-muted);text-decoration:none;cursor:pointer}
    #table-root .source-link:hover{text-decoration:underline;color:var(--text-secondary)}
    #table-root .source-label{color:var(--text-faint);font-size:11px}

    /* ── Filter bar ── */

  async function getSourceText(kind, bust) {
    if (dataSource === 'csv') {
      const t = csvData[kind] || '';
      if (!t) {
        if (kind === 'views') return null;
        throw new Error('No uploaded CSV for ' + kind + '.');

    if (!url) {

    let u = toCSVUrl(url);
    if (bust) u += (u.includes('?') ? '&' : '?') + '_=' + Date.now();
    const r = await fetch(u);
    if (!r.ok) throw new Error('Could not load the ' + kind + ' sheet (HTTP ' + r.status + ').');

    if (t.trimStart().startsWith('<!') || t.trimStart().startsWith('<html')) {

    const rect = canvas.getBoundingClientRect();
    const hiResScale = devicePixelRatio * 1.5;
    canvas.width  = Math.max(600, Math.floor(rect.width  * hiResScale));
    canvas.height = Math.max(400, Math.floor(rect.height * hiResScale));
    canvas.style.width = rect.width + 'px';
    canvas.style.height = rect.height + 'px';
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  }

  /************************************************************************
   * NODE SIZING
   ************************************************************************/
  function updateNodeSizes() {
    if (nodes.length === 0) return;
    
    const mode = formattingSettings.nodeSizeMode;
    
    if (mode === 'custom') {
      // Fixed size for all nodes
      nodes.forEach(n => {
        n.baseR = formattingSettings.nodeSize;
        n.r = n.baseR;
      });
    } else {
      // Compute the metric for each node based on mode
      let metricValues = [];
      nodes.forEach(n => {
        let val = 0;
        if (mode === 'connections') {
          val = (adjacency.get(n.id) || new Set()).size;
        } else if (mode === 'connectionsOutTotal') {
          val = connectionOutTotals.get(n.id) || 0;
        } else if (mode === 'connectionsInTotal') {
          val = connectionInTotals.get(n.id) || 0;
        }
        n._sizeMetric = val;
        metricValues.push(val);
      });
      
      const maxVal = Math.max(...metricValues, 1);
      const minVal = Math.min(...metricValues, 0);
      
      nodes.forEach(n => {
        const normalized = maxVal > minVal 
          ? (n._sizeMetric - minVal) / (maxVal - minVal)
          : 0.5;
        n.baseR = formattingSettings.minNodeSize + normalized * (formattingSettings.maxNodeSize - formattingSettings.minNodeSize);
        n.r = n.baseR;
      });
    }
  }

  /************************************************************************
   * VALUE FORMATTING
   ************************************************************************/
  function formatValue(value, prefix) {
    if (value == null || isNaN(value)) return '';
    const absVal = Math.abs(value);
    let num, suffix;
    if (absVal >= 1e9) { num = value / 1e9; suffix = 'B'; }
    else if (absVal >= 1e6) { num = value / 1e6; suffix = 'M'; }
    else if (absVal >= 1e3) { num = value / 1e3; suffix = 'k'; }
    else { return (prefix || '') + String(Math.round(value)); }
    let str = num.toFixed(1);
    if (str.endsWith('.0')) str = str.slice(0, -2);
    return (prefix || '') + str + suffix;
  }

  /************************************************************************

  async function autoLoadData() {
    if (dataSource === 'sheets' && (!CONFIG.entitiesUrl || !CONFIG.connectionsUrl)) {
      loadingText.textContent = 'No data source is connected.';
      return;
    }
    if (dataSource === 'csv' && (!csvData.entities || !csvData.connections)) {
      loadingText.textContent = 'No uploaded CSV data found.';
      return;
    }

    loadingOverlay.style.display = 'flex';
    loadingText.textContent = 'Loading data...';

    try {
      // Fetch entities and connections (required) — from Google Sheets or
      // from the uploaded CSV snapshots, depending on dataSource.
      const [entitiesText, connectionsText] = await Promise.all([
        getSourceText('entities', false),
        getSourceText('connections', false)
      ]);

      const entitiesData = Papa.parse(entitiesText, { header: true, skipEmptyLines: true }).data;
      const connectionsData = Papa.parse(connectionsText, { header: true, skipEmptyLines: true }).data;

      // NOTE: formatting is no longer read from a sheet — it is set via the
      // in-tool Options menu and stored in the saved HTML file.

      // Try to load views (optional)
      try {
        const viewsText = await getSourceText('views', false);
        if (viewsText) {
          const viewsDataParsed = Papa.parse(viewsText, { header: true, skipEmptyLines: true }).data;
          parseViewsData(viewsDataParsed);
        }
      } catch (e) {
        // Views source is optional, ignore errors
      }

      loadSession(entitiesData, connectionsData);

    } catch (err) {
      loadingText.textContent = 'Error: ' + err.message;
      setTimeout(() => {
        // Update story button visibility
        updateStoryButtonVisibility();

        loadingOverlay.style.display = 'none';
      }, 3000);
    }
  }

  /************************************************************************
   * REFRESH DATA
   * Re-fetches the live Google Sheets (or re-reads the uploaded CSV
   * snapshots) and rebuilds the chart so it matches the current data:
   * removed entities/connections disappear, new ones appear. Saved node
   * positions for entities that no longer exist are pruned so the
   * exported/saved file stays clean.
   ************************************************************************/
  async function refreshData() {
    if (dataSource === 'sheets' && (!CONFIG.entitiesUrl || !CONFIG.connectionsUrl)) {
      alert('No data source is connected. Use \u201cNew / Load\u201d to connect a chart first.');
      return;
    }
    if (dataSource === 'csv' && (!csvData.entities || !csvData.connections)) {
      alert('No uploaded CSV data found. Use the connection screen to upload CSVs first.');
      return;
    }

    loadingOverlay.style.display = 'flex';
    loadingText.textContent = 'Refreshing data\u2026';

    try {
      // Cache-busted fetch for Google Sheets (Google caches published CSVs
      // aggressively); uploaded CSV snapshots are just re-read from memory.
      const [entitiesText, connectionsText] = await Promise.all([
        getSourceText('entities', true),
        getSourceText('connections', true)
      ]);

      const entitiesData = Papa.parse(entitiesText, { header: true, skipEmptyLines: true }).data;
      const connectionsData = Papa.parse(connectionsText, { header: true, skipEmptyLines: true }).data;

      // Refresh views too, so removed/added views are also reflected. Clear
      // first so a now-empty or unreachable views source doesn't keep stale ones.
      viewsData = [];
      viewsById.clear();
      sortedViewIds = [];
      currentViewIndex = 0;
      try {
        const viewsText = await getSourceText('views', true);
        if (viewsText) {
          const viewsDataParsed = Papa.parse(viewsText, { header: true, skipEmptyLines: true }).data;
          parseViewsData(viewsDataParsed);
        }
      } catch (e) {
        // Views source is optional, ignore errors
      }

      // Rebuild the whole session from the fresh data. Nodes that the user
      // positioned (grid coords stored in savedPositions) keep their spot;
      // brand-new entities are placed by physics.
      loadSession(entitiesData, connectionsData);

      // CLEAN THE SAVED DATA: drop saved positions for entities that no longer
      // exist, so a subsequent "Export saved HTML" reflects only current data.
      // (Entities hidden by the connection filter still exist, so their
      // saved positions are kept.)
      const liveNames = new Set(allNodes.map(n => n.name));
      Array.from(savedPositions.keys()).forEach(k => {
        if (!liveNames.has(k)) savedPositions.delete(k);
      });

      // A previously-selected/hovered node may have been removed or hidden.
      if (selectedNode && !nodeById.has(selectedNode.id)) {
        selectedNode = null;
        if (!isStoryMode) clearInfoPanel();
      }
      hoveredNode = null;
      hoveredConnection = null;

      render();
    } catch (err) {
      loadingText.textContent = 'Refresh failed: ' + err.message;
      setTimeout(() => { loadingOverlay.style.display = 'none'; }, 3000);
    }
  }

  function parseViewsData(data) {
    if (!data || data.length === 0) return;
    
    // Clean headers
    data.forEach(r => { 
      Object.keys(r).forEach(k => { 
        if (k !== k.trim()) { 
          r[k.trim()] = r[k]; 
          delete r[k]; 
        } 
      }); 
    });

    viewsData = data.map(r => ({
      id: String(r['View ID'] || '').trim(),
      title: String(r['View Title'] || '').trim(),
      text: String(r['View Text'] || '').trim(),
      image: String(r['View Image'] || '').trim()
    })).filter(v => v.id);

    // Build views by ID map
    viewsById.clear();
    viewsData.forEach(v => {
      viewsById.set(v.id, v);
    });

    // Sort view IDs numerically
    sortedViewIds = viewsData.map(v => v.id).sort((a, b) => {
      const numA = parseInt(a);
      const numB = parseInt(b);
      if (!isNaN(numA) && !isNaN(numB)) {
        return numA - numB;
      }
      return a.localeCompare(b);
    });
  }

  /************************************************************************
   * LOAD SESSION
   ************************************************************************/
  function loadSession(entitiesData, connectionsData) {
    // Clean headers
    entitiesData.forEach(r => { 
      Object.keys(r).forEach(k => { 
        if (k !== k.trim()) { 
          r[k.trim()] = r[k]; 
          delete r[k]; 
        } 
      }); 
    });
    
    connectionsData.forEach(r => { 
      Object.keys(r).forEach(k => { 
        if (k !== k.trim()) { 
          r[k.trim()] = r[k]; 
          delete r[k]; 
        } 
      }); 
    });

    // Check if Entities.csv has Views column
    if (entitiesData.length > 0) {
      hasViewsColumn = 'Views' in entitiesData[0];
    }

    // Create nodes
    nodes = entitiesData.map((d, i) => createNodeFromData(d, i));
    nodeById = new Map(nodes.map(n => [n.id, n]));

    // Build entity views map if we have views (the per-view entity cache is
    // built by applyConnectionFilter, once the visible set is known)
    if (hasViewsColumn) {
      buildEntityViewsMap(entitiesData);
    }

    // Create links
    processLinksData(connectionsData);

    // Apply any manually-saved node positions (overrides sheet X/Y). Done on
    // the full set so a hidden node keeps its spot for when it's shown again.
    applySavedPositions();

    // Keep the full data, then derive the visible nodes/links from it. This
    // also builds adjacency, connection value totals and the search index.
    allNodes = nodes;
    allLinks = links;
    applyConnectionFilter();

    // Resolve the "Cell" column against the current cell configuration
    normalizeCellSettings();
    updateCellAssignments();

    nameIndex = nodes.map(n => n.name);

    // Calculate node sizes
    updateNodeSizes();

    // Determine layout: if most nodes have grid coords, use static grid;
    // otherwise let physics handle positioning
    const gridCount = nodes.filter(n => n.hasGridCoords || n.cellIdx != null).length;
    const isStaticLayout = gridCount > nodes.length * 0.5;

    // Show/hide the info panel BEFORE computing layout. The panel is a flex
    // sibling of #graph-area, so it claims width on the right; if we lay out
    // first, nodes get centered across the full window and end up hidden
    // behind the panel. updateInfoPanelVisibility() flips display synchronously,
    // and the synchronous resizeCanvas() that follows reads the (now narrower)
    // graph-area width so computeGridLayout() centers into the visible space.
    updateInfoPanelVisibility();
    resizeCanvas();

    // Compute initial grid layout (positions grid nodes, scales radii)
    computeGridLayout();

    // Load images
    loadAllImages();
    
    // Load background image if enabled
    loadBackgroundImage();

    // Preload all story mode view images immediately
    preloadStoryImages();

    // Start physics (for non-grid nodes)
    updatePhysics();

    // Update story button visibility
    updateStoryButtonVisibility();
    
    // Update UI elements from formatting
    updateLogoFromSettings();
    updateTitleFromSettings();
    updateShareFromSettings();
    // (info panel visibility already applied before the layout above)

    // Update legend after nodes are loaded
    updateCategoryColors();
    updateLegend();
    updateShapeLegend();
    
    // FORCE legend update again to be absolutely certain
    setTimeout(() => {
      updateCategoryColors();
      updateLegend();
      updateShapeLegend();
      computeGridLayout();
      render();
    }, 150);

    loadingOverlay.style.display = 'none';
  }

  /************************************************************************
   * GRID LAYOUT — maps grid coordinates to canvas pixels
   * Grid is 60×60: x ∈ [-30,30], y ∈ [-30,30], (0,0) = centre
   * Positive Y = up (canvas Y is inverted)
   ************************************************************************/
  function computeGridLayout() {
    if (nodes.length === 0) return;

    const cw = canvas.width / devicePixelRatio;
    const ch = canvas.height / devicePixelRatio;
    const legendPad = getLegendPadding();
    const pad = CONFIG.gridPadding;

    const availW = cw - pad * 2;
    const availH = ch - pad * 2 - legendPad;

    // One grid unit = gridScale pixels; fit 60 units into the smaller axis
    gridScale = Math.min(availW, availH) / CONFIG.gridUnits;

    // UI scale: how big things look relative to a ~900px-wide reference
    uiScale = Math.min(availW, availH) / CONFIG.baseChartWidth;

    const centerX = cw / 2;
    const centerY = pad + legendPad + availH / 2;
    gridCenterX = centerX;
    gridCenterY = centerY;

    nodes.forEach(n => {
      // Only reposition nodes that have grid coordinates
      if (n.hasGridCoords) {
        const px = centerX + n.gridX * gridScale;
        const py = centerY - n.gridY * gridScale;   // flip Y
        n.x = px;
        n.y = py;
        n.fx = px;
        n.fy = py;
      }

      // Scale radius for ALL nodes (grid + physics)
      n.r = (n.baseR || formattingSettings.minNodeSize)
            * formattingSettings.sizeScale
            * uiScale;
    });

    // Cell-assigned nodes are positioned last: their slots depend on the
    // radii and grid scale computed just above.
    applyCellLayout();

    // Keep collision radii in step with the new node sizes
    if (simulation && simulation.force('collide')) {
      const pad = effectiveCollisionPadding();
      simulation.force('collide').radius(d => d.r + pad);
    }
  }

  /************************************************************************
   * GRID <-> PIXEL HELPERS + POSITION PERSISTENCE
   ************************************************************************/
  function gridToPixel(gx, gy) {
    return { x: gridCenterX + gx * gridScale, y: gridCenterY - gy * gridScale };
  }
  function pixelToGrid(px, py) {
    if (!gridScale) return { gx: 0, gy: 0 };
    return { gx: (px - gridCenterX) / gridScale, gy: (gridCenterY - py) / gridScale };
  }

  // Freeze every currently-unfixed node at its present position (mode 'freezeAfterInitial')
  function freezeAllNodes() {
    nodes.forEach(n => {
      if (!n.hasGridCoords) {
        const g = pixelToGrid(n.x, n.y);
        n.gridX = g.gx;
        n.gridY = g.gy;
        n.hasGridCoords = true;
        n.fx = n.x;
        n.fy = n.y;
      }
    });
    if (simulation) simulation.stop();
  }

  // Apply manually-saved grid positions (overrides any X/Y from the sheet)
  function applySavedPositions() {
    if (!savedPositions || savedPositions.size === 0) return;
    nodes.forEach(n => {
      if (savedPositions.has(n.name)) {
        const p = savedPositions.get(n.name);
        n.gridX = p.x;
        n.gridY = p.y;
        n.hasGridCoords = true;
      }
    });
  }

  function rebuildShapeCategoryMap() {
    shapeCategoryMap.clear();
    shapeLegendEntries.forEach(e => {
      if (e.enabled && e.label) shapeCategoryMap.set(e.label, e.shape);
    });
  }

  function sanitizeFilename(name) {
    return (String(name || 'chart').trim() || 'chart')
      .replace(/[^a-z0-9\-_ ]/gi, '')
      .replace(/\s+/g, '-')
      .slice(0, 80) || 'chart';
  }

  // Apply a parsed saved-chart data object to the live viewer state.
  // Used by both the standalone boot path and the tool's "load saved chart".
  function applyChartData(data) {
    if (!data) return;
    if (data.settings) {
      Object.assign(formattingSettings, data.settings);
      // Pre-slider charts stored word-label physics strengths; they no longer
      // map onto anything, so drop them and keep the current defaults.
      delete formattingSettings.attractStrength;
      delete formattingSettings.repelStrength;
      delete formattingSettings.paddingStrength;
    }
    if (Array.isArray(data.colorLegend)) colorLegendEntries = data.colorLegend;
    if (Array.isArray(data.shapeLegend)) { shapeLegendEntries = data.shapeLegend; rebuildShapeCategoryMap(); }
    if (data.physicsMode) physicsMode = data.physicsMode;
    if (typeof data.physicsDuration === 'number' && isFinite(data.physicsDuration)) {
      physicsDurationSec = Math.min(20, Math.max(1, Math.round(data.physicsDuration)));
    }
    if (data.title) { chartName = data.title; document.title = data.title; }
    if (data.urls) {
      CONFIG.entitiesUrl = data.urls.entities || '';
      CONFIG.connectionsUrl = data.urls.connections || '';
      CONFIG.viewsUrl = data.urls.views || '';
    }
    CONFIG.formattingUrl = ''; // formatting now lives in settings, never a sheet
    if (data.source) dataSource = data.source;
    if (data.csv) {
      csvData.entities = data.csv.entities || '';
      csvData.connections = data.csv.connections || '';
      csvData.views = data.csv.views || '';
    }
    if (data.positions) {
      savedPositions = new Map(Object.entries(data.positions).map(([k, v]) => [k, { x: v.x, y: v.y }]));
    }
    if (formattingSettings.backgroundColor) {
      document.documentElement.style.setProperty('--white', formattingSettings.backgroundColor);
    }
    normalizeCellSettings();
  }

    // "Custom Node Color" column: a hex colour with or without a leading "#".
    // Accepts 3-digit (F60) and 6-digit (FF6600) forms; spaces are ignored.
    // Anything else is treated as blank, so the node falls back to its image
    // or to the default node colour from the Options menu.
    function parseHexColor(v) {
      if (v === undefined || v === null) return null;
      let h = String(v).replace(/\s+/g, '').replace(/^#/, '');
      if (/^[0-9a-fA-F]{3}$/.test(h)) h = h.split('').map(c => c + c).join('');
      return /^[0-9a-fA-F]{6}$/.test(h) ? '#' + h.toUpperCase() : null;
    }

    // "Inner Node Label" column: text drawn inside the node. Line breaks typed
    // in the cell are kept; runs of spaces collapse to one.
    function parseInnerLabel(v) {
      if (v === undefined || v === null) return '';
      return String(v).replace(/\r\n?/g, '\n').split('\n')
        .map(l => l.replace(/[ \t]+/g, ' ').trim())
        .filter(l => l !== '')
        .join('\n');
    }

    function createNodeFromData(d, i) {
        const id = d['Entity Name'] ? String(d['Entity Name']).trim() : `__P_${i}`;
        
        // Optional "Cell" column: a 1-based cell number, blank = unassigned.
        const cellNum = parseInt(String(d['Cell'] === undefined || d['Cell'] === null ? '' : d['Cell']).trim(), 10);
        const cellValue = (isFinite(cellNum) && cellNum > 0) ? cellNum : null;

        // Force all nodes to start without grid coordinates. 
        // Ignores the spreadsheet entirely.
        const hasGridCoords = false;
        const gridX = 0;
        const gridY = 0;

        const cw = canvas.width / devicePixelRatio;
        const ch = canvas.height / devicePixelRatio;
        const x = Math.random() * cw;
        const y = Math.random() * ch;
        
        return {
        id, 
        name: id, 
        raw: d, 
        cellValue,
        cellIdx: null,
        manualInCell: false,
        order: i,            // sheet row order, drives spacing order in a cell
        hasGridCoords,
        gridX,
        gridY,
        image: d['Image'] ? d['Image'].trim() : null, 
        imageBitmap: null,
        customColor: parseHexColor(d['Custom Node Color']),
        innerLabel: parseInnerLabel(d['Inner Node Label']),
        x, 
        y,
        fx: null,
        fy: null,
        vx: 0, 
        vy: 0, 
        baseR: formattingSettings.minNodeSize,
        r: formattingSettings.minNodeSize
        };
    }

  function processLinksData(connectionsData) {
    _lineSizeRange = null; // Reset line sizing cache
    const tmpLinks = connectionsData.map(r => {
      const rawValue = (r['Value']||'').toString().trim().replace(/[, ]/g, '');
      const parsedValue = parseFloat(rawValue);
      return {
        sourceName: (r['A']||'').toString().trim(),
        targetName: (r['B']||'').toString().trim(),
        connectionValue: !isNaN(parsedValue) ? parsedValue : null,
        source: (r['Source']||'').toString().trim(),
        note: (r['Note']||'').toString().trim(),
        text: (r['Text']||'').toString().trim()
      };
    }).filter(l => l.sourceName && l.targetName);

    // Add missing nodes from links
    tmpLinks.forEach(l => {
      if (!nodeById.has(l.sourceName)) {
        const n = { 
          id: l.sourceName, 
          name: l.sourceName, 
          raw: {}, 
          cellValue: null,
          cellIdx: null,
          manualInCell: false,
          order: 100000 + nodes.length,
          hasGridCoords: false,
          gridX: 0,
          gridY: 0,
          image: null, 
          imageBitmap: null, 
          x: Math.random() * (canvas.width/(devicePixelRatio)), 
          y: Math.random() * (canvas.height/(devicePixelRatio)), 
          fx: null,
          fy: null,
          vx: 0, 
          vy: 0, 
          baseR: formattingSettings.minNodeSize,
          r: formattingSettings.minNodeSize
        };
        nodes.push(n);
        nodeById.set(n.id, n);
      }
      if (!nodeById.has(l.targetName)) {
        const n = { 
          id: l.targetName, 
          name: l.targetName, 
          raw: {}, 
          cellValue: null,
          cellIdx: null,
          manualInCell: false,
          order: 100000 + nodes.length,
          hasGridCoords: false,
          gridX: 0,
          gridY: 0,
          image: null, 
          imageBitmap: null, 
          x: Math.random() * (canvas.width/(devicePixelRatio)), 
          y: Math.random() * (canvas.height/(devicePixelRatio)), 
          fx: null,
          fy: null,
          vx: 0, 
          vy: 0, 
          baseR: formattingSettings.minNodeSize,
          r: formattingSettings.minNodeSize
        };
        nodes.push(n);
        nodeById.set(n.id, n);
      }
    });

    // Build links with references to node objects
    links = tmpLinks.map(l => ({
      source: nodeById.get(l.sourceName),
      target: nodeById.get(l.targetName),
      connectionValue: l.connectionValue,
      sourceUrl: l.source,
      note: l.note,
      text: l.text
    })).filter(l => l.source && l.target);
  }

  function buildEntityViewsMap(entitiesData) {
    entityViewsMap.clear();
    entityHighlightsMap.clear();
    
    entitiesData.forEach(row => {
      const entityName = String(row['Entity Name'] || '').trim();
      const viewsStr = String(row['Views'] || '').trim();
      const highlightStr = String(row['View Highlight'] || '').trim();
      
      if (entityName && viewsStr) {
        const viewIds = viewsStr.split(',').map(id => id.trim()).filter(id => id);
        entityViewsMap.set(entityName, viewIds);
      }
      
      if (entityName && highlightStr) {
        const highlightViewIds = highlightStr.split(',').map(id => id.trim()).filter(id => id);
        entityHighlightsMap.set(entityName, new Set(highlightViewIds));
      }
    });
  }

  function buildViewEntitiesCache() {
    viewEntitiesCache.clear();
    
    // Initialize cache for all views
    sortedViewIds.forEach(viewId => {
      viewEntitiesCache.set(viewId, []);
    });

    // Populate cache
    entityViewsMap.forEach((viewIds, entityId) => {
      // Entities hidden by the connection filter are left out of every view.
      if (!nodeById.has(entityId)) return;
      viewIds.forEach(viewId => {
        // Only add if view exists in viewsById
        if (viewsById.has(viewId)) {
          const entityList = viewEntitiesCache.get(viewId);
          if (entityList) {
            entityList.push(entityId);
          }
        }
      });
    });
  }

  function updateStoryButtonVisibility() {
    const shouldShow = viewsData.length > 0 && hasViewsColumn;
    storyBtn.style.display = shouldShow ? 'block' : 'none';
  }

  /************************************************************************
   * CONNECTION FILTER — "Hide nodes with N or less connections"
   * Connections are counted on the full data (distinct entities linked to,
   * either direction — the same count as the "# of connections" size mode).
   * Entities at or below the threshold are dropped from `nodes`, and every
   * connection touching them is dropped from `links`.
   ************************************************************************/
  function hideConnectionThreshold() {
    const v = formattingSettings.hideMaxConnections;
    if (v === null || v === undefined || String(v).trim() === '') return null;
    const n = Math.floor(Number(v));
    return (isFinite(n) && n >= 0) ? n : null;
  }

  function applyConnectionFilter() {
    const max = hideConnectionThreshold();
    if (max == null) {
      nodes = allNodes.slice();
      links = allLinks.slice();
    } else {
      const nbrs = new Map();
      allLinks.forEach(l => {
        const s = l.source.id, t = l.target.id;
        if (!nbrs.has(s)) nbrs.set(s, new Set());
        if (!nbrs.has(t)) nbrs.set(t, new Set());
        nbrs.get(s).add(t);
        nbrs.get(t).add(s);
      });
      const keep = new Set();
      allNodes.forEach(n => {
        const deg = nbrs.has(n.id) ? nbrs.get(n.id).size : 0;
        if (deg > max) keep.add(n.id);
      });
      nodes = allNodes.filter(n => keep.has(n.id));
      links = allLinks.filter(l => keep.has(l.source.id) && keep.has(l.target.id));
    }
    nodeById = new Map(nodes.map(n => [n.id, n]));
    nameIndex = nodes.map(n => n.name);
    _lineSizeRange = null;
    buildAdjacency();
    computeConnectionValueTotals();
    if (hasViewsColumn) buildViewEntitiesCache();
  }

  // Live change from the Options menu: re-filter and re-lay out in place.
  // Surviving nodes keep their current positions; newly revealed ones are
  // placed by physics (or by their saved position / cell).
  function setHideMaxConnections(v) {
    formattingSettings.hideMaxConnections = v;
    if (!allNodes.length) return;
    applyConnectionFilter();
    if (selectedNode && !nodeById.has(selectedNode.id)) {
      selectedNode = null;
      if (isStoryMode) hideEntityModal(); else clearInfoPanel();
    }
    if (hoveredNode && !nodeById.has(hoveredNode.id)) hoveredNode = null;
    hoveredConnection = null;
    updateNodeSizes();
    updateCategoryColors();
    updateLegend();
    updateShapeLegend();
    updateCellAssignments();
    computeGridLayout();
    updatePhysics();
    if (selectedNode && !isStoryMode) populateInfoPanel(selectedNode);
    render();
  }

  function buildAdjacency() {
    adjacency.clear();
    connectionSources.clear();
    connectionTexts.clear();
    
    links.forEach(l => {
      const sId = l.source.id;
      const tId = l.target.id;
      
      if (!adjacency.has(sId)) adjacency.set(sId, new Set());
      if (!adjacency.has(tId)) adjacency.set(tId, new Set());
      adjacency.get(sId).add(tId);
      adjacency.get(tId).add(sId);
      
      // Track source URLs for connections
      if (l.sourceUrl) {
        if (!connectionSources.has(sId)) connectionSources.set(sId, new Map());
        if (!connectionSources.has(tId)) connectionSources.set(tId, new Map());
        connectionSources.get(sId).set(tId, l.sourceUrl);
        connectionSources.get(tId).set(sId, l.sourceUrl);
      }
      
      // Track text descriptions for connections
      if (l.text) {
        if (!connectionTexts.has(sId)) connectionTexts.set(sId, new Map());
        if (!connectionTexts.has(tId)) connectionTexts.set(tId, new Map());
        connectionTexts.get(sId).set(tId, l.text);
        connectionTexts.get(tId).set(sId, l.text);
      }
    });
  }

  function computeConnectionValueTotals() {
    connectionOutTotals.clear();
    connectionInTotals.clear();
    links.forEach(l => {
      const sId = l.source.id;
      const tId = l.target.id;
      const val = l.connectionValue;
      if (val != null && !isNaN(val)) {
        connectionOutTotals.set(sId, (connectionOutTotals.get(sId) || 0) + val);
        connectionInTotals.set(tId, (connectionInTotals.get(tId) || 0) + val);
      }
    });
  }

    if (formattingSettings.backgroundImageEnabled && formattingSettings.backgroundImageUrl) {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => { backgroundImageObj = img; render(); };
      img.onerror = () => { backgroundImageObj = null; };

  /************************************************************************
   * STORY MODE
   ************************************************************************/
  function enterStoryMode() {
    if (sortedViewIds.length === 0) return;
    
    isStoryMode = true;
    currentViewIndex = 0;
    
    // Clear selection
    selectedNode = null;
    clearInfoPanel();
    
    // Hide normal UI elements
    storyBtn.style.display = 'none';
    nodeInfo.style.display = 'none';
    document.getElementById('node-links').style.display = 'none';
    connectionsBox.style.display = 'none';
    
    // Hide search controls and clear button in story mode
    document.getElementById('controls').classList.add('story-mode-hide');
    clearBtn.classList.add('story-mode-hide');
    
    // Show story UI elements
    storyNavContainer.classList.add('active');
    viewContent.classList.add('active');
    
    // Display current view
    updateStoryModeUI();
    
    // Animate pan & zoom to first view's nodes
    animateToViewNodes();
  }

  function exitStoryMode() {
    isStoryMode = false;
    
    // Clear selection
    selectedNode = null;
    hideEntityModal();
    
    // Reset zoom and pan
    zoomLevel = 1.0;
    panX = 0;
    panY = 0;
    
    // Show normal UI elements
    updateStoryButtonVisibility();
    nodeInfo.style.display = 'block';
    document.getElementById('node-links').style.display = 'block';
    connectionsBox.style.display = 'block';
    
    // Show search controls and clear button when exiting story mode
    document.getElementById('controls').classList.remove('story-mode-hide');
    clearBtn.classList.remove('story-mode-hide');
    
    // Hide story UI elements
    storyNavContainer.classList.remove('active');
    viewContent.classList.remove('active');
    
    // Clear info panel
    clearInfoPanel();
    render();
  }

  function navigateView(direction) {
    if (direction === 'prev' && currentViewIndex > 0) {
      currentViewIndex--;
    } else if (direction === 'next' && currentViewIndex < sortedViewIds.length - 1) {
      currentViewIndex++;
    }
    
    // Clear selection and hide modal when navigating
    selectedNode = null;
    hideEntityModal();
    
    updateStoryModeUI();
    
    // Animate pan & zoom to focus on current view nodes
    animateToViewNodes();
  }
  
  function animateToViewNodes() {
    const viewId = sortedViewIds[currentViewIndex];
    const viewEntities = new Set(viewEntitiesCache.get(viewId) || []);
    
    // Filter nodes in current view
    const viewNodes = nodes.filter(n => viewEntities.has(n.id));
    
    if (viewNodes.length === 0) {
      render();
      return;
    }
    
    // Calculate bounding box of view nodes including their radii
    let minX = Infinity;
    let maxX = -Infinity;
    let minY = Infinity;
    let maxY = -Infinity;
    
    viewNodes.forEach(n => {
      const radius = n.r || 15; // Use actual node radius
      minX = Math.min(minX, n.x - radius);
      maxX = Math.max(maxX, n.x + radius);
      minY = Math.min(minY, n.y - radius);
      maxY = Math.max(maxY, n.y + radius);
    });
    
    const width = maxX - minX;
    const height = maxY - minY;
    const dataCenterX = (minX + maxX) / 2;
    const dataCenterY = (minY + maxY) / 2;
    
    // Calculate target zoom to fit all nodes with padding
    const canvasWidth = canvas.width / devicePixelRatio;
    const canvasHeight = canvas.height / devicePixelRatio;
    const canvasCenterX = canvasWidth / 2;
    
    // In Story Mode, account for legend space at top
    const legendSpace = 50; // Legend height + margin
    const effectiveHeight = canvasHeight - legendSpace;
    const canvasCenterY = legendSpace + (effectiveHeight / 2); // Shift center down
    
    const padding = 70; // padding in pixels
    
    const targetZoomX = width > 0 ? (canvasWidth - padding * 2) / width : 1.5;
    const targetZoomY = height > 0 ? (effectiveHeight - padding * 2) / height : 1.5;
    let targetZoom = Math.min(targetZoomX, targetZoomY);
    
    // Clamp zoom to configured limits
    targetZoom = Math.max(CONFIG.zoomMin, Math.min(CONFIG.zoomMax, targetZoom));
    
    // Calculate target pan to center the nodes
    // Based on the transform: screen = (data - canvasCenter) * zoom + pan + canvasCenter
    // To center data at canvasCenter: pan = -(data - canvasCenter) * zoom
    const targetPanX = -(dataCenterX - canvasCenterX) * targetZoom;
    const targetPanY = -(dataCenterY - canvasCenterY) * targetZoom;
    
    // Store starting values
    const startZoom = zoomLevel;
    const startPanX = panX;
    const startPanY = panY;
    
    // Animation parameters
    const duration = 600; // milliseconds
    const startTime = Date.now();
    
    function animate() {
      const elapsed = Date.now() - startTime;
      const progress = Math.min(elapsed / duration, 1);
      
      // Ease-in-out function for smooth animation
      const eased = progress < 0.5 
        ? 2 * progress * progress 
        : 1 - Math.pow(-2 * progress + 2, 2) / 2;
      
      // Interpolate zoom and pan
      zoomLevel = startZoom + (targetZoom - startZoom) * eased;
      panX = startPanX + (targetPanX - startPanX) * eased;
      panY = startPanY + (targetPanY - startPanY) * eased;
      
      render();
      
      if (progress < 1) {
        requestAnimationFrame(animate);
      }
    }
    
    animate();
  }

  function updateStoryModeUI() {
    const viewId = sortedViewIds[currentViewIndex];
    const view = viewsById.get(viewId);
    
    if (!view) return;
    
    // Update progress
    viewProgress.textContent = `Page ${currentViewIndex + 1} of ${sortedViewIds.length}`;
    
    // Update title
    viewTitle.textContent = view.title;
    
    // Update image
    if (view.image) {
      viewImage.src = view.image;
      viewImage.style.display = 'block';
    } else {
      viewImage.style.display = 'none';
    }
    
    // Update text
    viewText.innerHTML = processHtmlLinks(view.text);
    
    // Update navigation buttons
    storyPrevBtn.disabled = currentViewIndex === 0;
    storyNextBtn.disabled = currentViewIndex === sortedViewIds.length - 1;
  }

  function showEntityModal(node) {
    entityModal.classList.add('active');
    populateEntityModal(node);
  }

  function hideEntityModal() {
    entityModal.classList.remove('active');
    selectedNode = null;
  }

  function populateEntityModal(d) {
    const desc = (d.raw && (d.raw['Description'] || '')) || '';
    const colorCat = (d.raw && (d.raw['Color Legend Category'] || '')) || '';

    // Build category/value summary for modal
    let catHtml = '';
    if (formattingSettings.showColorLegendCategoryName && colorCat) {
      const title = formattingSettings.colorLegendCategoryTitle || 'Category';
      catHtml = `<div style="font-size: 16px; font-weight: bold; margin-top: 6px;">${title}: ${colorCat}</div>`;
    }
    
    let valHtml = '';
    if (formattingSettings.showTotalInValue) {
      const totalIn = connectionInTotals.get(d.id) || 0;
      if (totalIn > 0) valHtml += `<div style="font-size:14px;margin-top:4px;"><b>${formattingSettings.totalInTitle}:</b> ${formatValue(totalIn, formattingSettings.connectionValuePrefix)}</div>`;
    }
    if (formattingSettings.showTotalOutValue) {
      const totalOut = connectionOutTotals.get(d.id) || 0;
      if (totalOut > 0) valHtml += `<div style="font-size:14px;margin-top:4px;"><b>${formattingSettings.totalOutTitle}:</b> ${formatValue(totalOut, formattingSettings.connectionValuePrefix)}</div>`;
    }

    entityModalTitle.html(`
      <div style="display:flex; align-items:center; gap:8px; font-size:24px; font-weight:700;">
        <span>${d.name}</span>
        ${d.image ? `<img src="${d.image}" style="width:40px; height:40px; object-fit:cover; border-radius:50%;">` : ''}
      </div>
      ${catHtml}
      ${valHtml}
      ${desc ? `<div style="font-size: 14px; font-weight: normal; max-height: 350px; overflow-y: auto; margin-top: 6px;">${processHtmlLinks(desc.replace(/\n/g, '<br>'))}</div>` : ''}

    `);

    // Get current view's entities for filtering connections
    const currentViewId = sortedViewIds[currentViewIndex];
    const currentViewEntities = new Set(viewEntitiesCache.get(currentViewId) || []);

    const conns = Array.from(adjacency.get(d.id) || []).slice();
    
    // Filter connections to only show those in current view
    const filteredConns = conns.filter(name => currentViewEntities.has(name));
    
    filteredConns.sort((a,b) => a.localeCompare(b, undefined, {sensitivity:'base'}));
    entityModalConnections.innerHTML = '';
    
    if (filteredConns.length === 0) {
      entityModalConnections.innerHTML = '<div class="muted" style="margin-top: 8px;">No connections in this view</div>';
      return;
    }
    
    const connBox = document.createElement('div');
    connBox.style.marginTop = '8px';
    connBox.style.background = 'var(--light-grey)';
    connBox.style.borderRadius = '6px';
    connBox.style.padding = '6px';
    connBox.style.border = '1px solid var(--shadow-grey)';
    connBox.style.maxHeight = '300px';
    connBox.style.overflow = 'auto';
    
    const frag = document.createDocumentFragment();
    const nodeSourceMap = connectionSources.get(d.id);
    const nodeTextsMap = connectionTexts.get(d.id);
    
    filteredConns.forEach(name => {
      const item = document.createElement('div');
      item.className = 'conn-item';
      item.style.display = 'flex';
      item.style.alignItems = 'center';
      item.style.justifyContent = 'space-between';
      item.style.gap = '8px';
      
      const nameSpan = document.createElement('span');
      // Display the text description if available, otherwise fall back to node name
      const textDesc = nodeTextsMap ? nodeTextsMap.get(name) : null;
      nameSpan.innerHTML = processHtmlLinks(textDesc || name);
      nameSpan.style.flex = '1';
      nameSpan.style.cursor = 'pointer';
      nameSpan.addEventListener('click', () => {
        const targetNode = nodeById.get(name);
        if (targetNode) {
          selectedNode = targetNode;
          populateEntityModal(targetNode);
          render();
        }
      });
      item.appendChild(nameSpan);
      
      const sourceUrl = nodeSourceMap ? nodeSourceMap.get(name) : null;
      if (sourceUrl) {
        const sourceIcon = document.createElement('a');
        sourceIcon.href = normalizeUrl(sourceUrl) || '#';
        sourceIcon.target = '_blank';
        sourceIcon.rel = 'noopener';
        sourceIcon.innerHTML = '➜]';
        sourceIcon.style.fontSize = '16px';
        sourceIcon.style.textDecoration = 'none';
        sourceIcon.style.cursor = 'pointer';
        sourceIcon.style.flexShrink = '0';
        sourceIcon.title = 'Source';
        sourceIcon.addEventListener('click', (e) => {
          e.stopPropagation();
        });
        item.appendChild(sourceIcon);
      }
      
      
      // Add hover handlers to highlight connection in chart
      item.addEventListener('mouseenter', () => {
        hoveredConnection = { source: d.id, target: name };
        render();
      });
      item.addEventListener('mouseleave', () => {
        hoveredConnection = null;
        render();
      });
      frag.appendChild(item);
    });
    
    connBox.appendChild(frag);
    entityModalConnections.appendChild(connBox);
  }

  /************************************************************************
   * IMAGE LOADING
   ************************************************************************/
  function loadAllImages() {
    // A Custom Node Color or Inner Node Label replaces the image inside the
    // node, so those images are never drawn and don't need loading.
    const imgNodes = nodes.filter(n => n.image && CONFIG.showImages && !nodeOverridesImage(n));
    Promise.allSettled(imgNodes.map(n => loadImage(n))).then(() => render());
  }

  function loadImage(node) {
    return new Promise(resolve => {
      // Request a CORS-clean image FIRST. Drawing a non-CORS image onto the
      // canvas taints it and permanently blocks toDataURL()/PNG export, so we
      // only fall back to a plain (tainting) load if the host refuses CORS.
      const corsImg = new Image();
      corsImg.crossOrigin = 'anonymous';
      corsImg.onload = () => {
        node.imageBitmap = corsImg;
        resolve();
      };
      corsImg.onerror = () => {
        // Host didn't allow cross-origin use. Load normally so the image still
        // displays on screen (note: this taints the canvas, disabling PNG export).
        const plainImg = new Image();
        plainImg.onload = () => { node.imageBitmap = plainImg; resolve(); };
        plainImg.onerror = () => { node.imageBitmap = null; resolve(); };
        plainImg.src = node.image;
      };
      corsImg.src = node.image;
    });
  }

  /************************************************************************
   * PRELOAD STORY MODE VIEW IMAGES
   ************************************************************************/
  const storyImageCache = new Map();

  function preloadStoryImages() {
    viewsData.forEach(v => {
      if (v.image && !storyImageCache.has(v.image)) {
        const img = new Image();
        img.src = v.image;
        storyImageCache.set(v.image, img);
      }
    });
  }


  /************************************************************************
   * CELLS
   * Divides the 60x60 chart grid into cells. Nodes carrying a "Cell" value
   * in the Entities sheet are auto-spaced inside their cell with physics
   * off, can be dragged only within that cell, and re-space when one of
   * them is placed manually or released.
   *
   * Cell geometry is always expressed in GRID units (y up, origin centre).
   ************************************************************************/
  const CELL_GRID_HALF = CONFIG.gridUnits / 2;   // 30

  // Configurations available per cell count (mirrors the L Structure sheet).
  const CELL_CONFIGS = {
    1:  [{ label: 'Single cell',                 spec: { type: 'rows',  rows: [1] } }],
    2:  [{ label: '2 across',                    spec: { type: 'rows',  rows: [2] } },
         { label: '2 stacked',                   spec: { type: 'rows',  rows: [1, 1] } },
         { label: 'Inner + outer ring',          spec: { type: 'rings', n: 2 } }],
    3:  [{ label: '3 across',                    spec: { type: 'rows',  rows: [3] } },
         { label: '2 over 1',                    spec: { type: 'rows',  rows: [2, 1] } },
         { label: '1 over 2',                    spec: { type: 'rows',  rows: [1, 2] } },
         { label: 'Inner + middle + outer ring', spec: { type: 'rings', n: 3 } }],
    4:  [{ label: '2 x 2',                       spec: { type: 'rows',  rows: [2, 2] } }],
    5:  [{ label: '3 over 2',                    spec: { type: 'rows',  rows: [3, 2] } },
         { label: '2 over 3',                    spec: { type: 'rows',  rows: [2, 3] } }],
    6:  [{ label: '3 across x 2 rows',           spec: { type: 'rows',  rows: [3, 3] } },
         { label: '2 across x 3 rows',           spec: { type: 'rows',  rows: [2, 2, 2] } }],
    7:  [{ label: '4 over 3',                    spec: { type: 'rows',  rows: [4, 3] } },
         { label: '3 over 4',                    spec: { type: 'rows',  rows: [3, 4] } }],
    8:  [{ label: '4 across x 2 rows',           spec: { type: 'rows',  rows: [4, 4] } }],
    9:  [{ label: '3 x 3',                       spec: { type: 'rows',  rows: [3, 3, 3] } }],
    10: [{ label: '8 squares + 2 centre rings',  spec: { type: 'squaresWithRings' } }]
  };

  function cellOptionsFor(count) { return CELL_CONFIGS[count] || CELL_CONFIGS[1]; }

  // The whole feature is dormant at a count of 1: the chart behaves exactly
  // as it did before cells existed (physics everywhere, no hiding, no chrome).
  function cellsActive() { return (Number(formattingSettings.cellCount) || 1) > 1; }

  function buildCells(spec) {
    const H = CELL_GRID_HALF, cells = [];
    if (spec.type === 'rows') {
      // Equal-size cells; a row holding fewer than the widest row is centred.
      const rows = spec.rows, maxCols = Math.max.apply(null, rows);
      const cw = (2 * H) / maxCols, chh = (2 * H) / rows.length;
      rows.forEach((k, ri) => {
        const y1 = H - ri * chh, y0 = y1 - chh, xStart = -(k * cw) / 2;
        for (let ci = 0; ci < k; ci++) {
          cells.push({ kind: 'rect', x0: xStart + ci * cw, x1: xStart + (ci + 1) * cw, y0: y0, y1: y1 });
        }
      });
    } else if (spec.type === 'rings') {
      // Concentric bands of equal radial thickness, inscribed in the grid.
      const t = H / spec.n;
      for (let i = 0; i < spec.n; i++) cells.push({ kind: 'ring', rInner: i * t, rOuter: (i + 1) * t });
    } else if (spec.type === 'squaresWithRings') {
      // 3x3 of squares; the centre square is replaced by two concentric rings.
      const cw = (2 * H) / 3;
      for (let ri = 0; ri < 3; ri++) {
        for (let ci = 0; ci < 3; ci++) {
          const x0 = -H + ci * cw, y1 = H - ri * cw;
          if (ri === 1 && ci === 1) {
            cells.push({ kind: 'ring', rInner: 0, rOuter: cw / 4 });
            cells.push({ kind: 'ring', rInner: cw / 4, rOuter: cw / 2 });
          } else {
            cells.push({ kind: 'rect', x0: x0, x1: x0 + cw, y0: y1 - cw, y1: y1 });
          }
        }
      }
    }
    return cells;
  }

  let _cellsCache = null, _cellsCacheKey = '';
  function currentCells() {
    const key = formattingSettings.cellCount + '|' + formattingSettings.cellOption;
    if (_cellsCache && _cellsCacheKey === key) return _cellsCache;
    const opts = cellOptionsFor(Number(formattingSettings.cellCount) || 1);
    const oi = Math.min(Math.max(0, (Number(formattingSettings.cellOption) || 1) - 1), opts.length - 1);
    _cellsCache = buildCells(opts[oi].spec);
    _cellsCacheKey = key;
    return _cellsCache;
  }
  function invalidateCells() { _cellsCache = null; _cellsCacheKey = ''; }

  function ensureCellTitles() {
    if (!Array.isArray(formattingSettings.cellTitles)) formattingSettings.cellTitles = [];
    while (formattingSettings.cellTitles.length < 10) formattingSettings.cellTitles.push('');
  }
  function normalizeCellSettings() {
    const fs = formattingSettings;
    let c = Math.round(Number(fs.cellCount));
    if (!isFinite(c) || c < 1) c = 1; if (c > 10) c = 10;
    fs.cellCount = c;
    const opts = cellOptionsFor(c);
    let o = Math.round(Number(fs.cellOption));
    if (!isFinite(o) || o < 1 || o > opts.length) o = 1;
    fs.cellOption = o;
    if (!isFinite(Number(fs.cellTitleSize))) fs.cellTitleSize = 16;
    ensureCellTitles();
    invalidateCells();
  }

  function cellTitle(i) {
    const t = formattingSettings.cellTitles;
    return (Array.isArray(t) && t[i]) ? String(t[i]).trim() : '';
  }
  // Vertical space (grid units) a rect cell reserves at its top for a title.
  function cellTitlePadGrid(i) {
    if (!gridScale) return 0;
    const cells = currentCells();
    if (!cells[i] || cells[i].kind !== 'rect' || !cellTitle(i)) return 0;
    return ((Number(formattingSettings.cellTitleSize) || 16) + 16) / gridScale;
  }

  // Push a grid point inside a cell, keeping the whole node circle within it.
  function clampToCell(cell, gx, gy, rGrid, titlePad) {
    if (!cell) return { gx: gx, gy: gy };
    if (cell.kind === 'rect') {
      const lox = cell.x0 + rGrid, hix = cell.x1 - rGrid;
      const loy = cell.y0 + rGrid, hiy = cell.y1 - titlePad - rGrid;
      return {
        gx: (lox > hix) ? (cell.x0 + cell.x1) / 2 : Math.min(hix, Math.max(lox, gx)),
        gy: (loy > hiy) ? (cell.y0 + cell.y1 - titlePad) / 2 : Math.min(hiy, Math.max(loy, gy))
      };
    }
    // Ring: the angle is free, the radius is clamped to the band.
    const mid = (cell.rInner + cell.rOuter) / 2;
    const lo = (cell.rInner === 0) ? 0 : cell.rInner + rGrid;
    const hi = cell.rOuter - rGrid;
    let d = Math.hypot(gx, gy);
    if (lo > hi) {
      if (cell.rInner === 0) return { gx: 0, gy: 0 };
      return (d < 1e-6) ? { gx: 0, gy: mid } : { gx: gx / d * mid, gy: gy / d * mid };
    }
    if (d < 1e-6) return (lo <= 0) ? { gx: 0, gy: 0 } : { gx: 0, gy: lo };
    const nd = Math.min(hi, Math.max(lo, d));
    return { gx: gx / d * nd, gy: gy / d * nd };
  }

  // Evenly spaced slots for n nodes inside one cell, in grid units.
  function cellSlots(cell, n, titlePad, rGrid) {
    const out = [];
    if (!cell || n <= 0) return out;

    if (cell.kind === 'ring') {
      // One node in the centre disc sits dead centre; otherwise nodes are
      // spread evenly around the band's mid-radius, packing tighter as the
      // count grows.
      if (cell.rInner === 0 && n === 1) return [{ gx: 0, gy: 0 }];
      const mid = (cell.rInner + cell.rOuter) / 2;
      for (let i = 0; i < n; i++) {
        const a = (2 * Math.PI * i) / n;               // 0 = top, clockwise
        out.push({ gx: mid * Math.sin(a), gy: mid * Math.cos(a) });
      }
      return out;
    }

    const x0 = cell.x0 + rGrid, x1 = cell.x1 - rGrid;
    const y0 = cell.y0 + rGrid, y1 = cell.y1 - titlePad - rGrid;
    const cx = (cell.x0 + cell.x1) / 2, cy = (cell.y0 + cell.y1 - titlePad) / 2;
    const w = x1 - x0, h = y1 - y0;
    if (w <= 0 || h <= 0) { for (let i = 0; i < n; i++) out.push({ gx: cx, gy: cy }); return out; }

    // Pick the rows x cols split that gives each node the most room, which
    // automatically follows the cell's aspect ratio.
    let best = null;
    for (let cols = 1; cols <= n; cols++) {
      const rows = Math.ceil(n / cols);
      const sz = Math.min(w / cols, h / rows);
      if (!best || sz > best.sz + 1e-9) best = { cols: cols, rows: rows, sz: sz };
    }
    const cw = w / best.cols, chh = h / best.rows;
    let placed = 0;
    for (let r = 0; r < best.rows; r++) {
      const k = Math.min(best.cols, n - placed);
      const rowStart = cx - (k * cw) / 2;             // a short last row centres
      for (let c = 0; c < k; c++) out.push({ gx: rowStart + (c + 0.5) * cw, gy: y1 - (r + 0.5) * chh });
      placed += k;
    }
    return out;
  }

  // Re-read the "Cell" column into node state. Blank, invalid and
  // out-of-range values all leave the node on physics.
  function updateCellAssignments() {
    invalidateCells();
    const active = cellsActive();
    const cells = active ? currentCells() : [];
    nodes.forEach(n => {
      const prev = n.cellIdx;
      let idx = null;
      if (active && n.cellValue != null && n.cellValue >= 1 && n.cellValue <= cells.length) {
        idx = n.cellValue - 1;
      }
      n.cellIdx = idx;
      n.manualInCell = (idx != null) && savedPositions.has(n.name);
      if (n.manualInCell) {
        const sp = savedPositions.get(n.name);
        n.gridX = sp.x; n.gridY = sp.y;
      }
      // Node just left the cell system — hand it back to physics.
      if (prev != null && idx == null && !savedPositions.has(n.name)) {
        n.hasGridCoords = false; n.fx = null; n.fy = null;
      }
    });
  }

  // Position every cell-assigned node. Manually placed nodes keep their spot
  // and claim the nearest slot; the rest fill the remaining slots in sheet
  // order. Hidden nodes still consume a slot.
  function applyCellLayout() {
    if (!cellsActive() || !nodes.length || !gridScale) return;
    const cells = currentCells();
    const buckets = cells.map(() => []);
    nodes.forEach(n => { if (n.cellIdx != null && buckets[n.cellIdx]) buckets[n.cellIdx].push(n); });

    buckets.forEach((list, ci) => {
      if (!list.length) return;
      list.sort((a, b) => (a.order || 0) - (b.order || 0));
      const cell = cells[ci];
      const titlePad = cellTitlePadGrid(ci);
      const rGrid = list.reduce((m, n) => Math.max(m, n.r || 0), 0) / gridScale;
      const slots = cellSlots(cell, list.length, titlePad, rGrid);
      const used = new Array(slots.length).fill(false);
      const autos = [];

      list.forEach(n => {
        if (!n.manualInCell) { autos.push(n); return; }
        const p = clampToCell(cell, n.gridX, n.gridY, rGrid, titlePad);
        n.gridX = p.gx; n.gridY = p.gy;
        let bi = -1, bd = Infinity;
        for (let i = 0; i < slots.length; i++) {
          if (used[i]) continue;
          const dx = slots[i].gx - p.gx, dy = slots[i].gy - p.gy, d = dx * dx + dy * dy;
          if (d < bd) { bd = d; bi = i; }
        }
        if (bi >= 0) used[bi] = true;
      });

      let k = 0;
      autos.forEach(n => {
        while (k < used.length && used[k]) k++;
        const s = slots[k] || slots[slots.length - 1] || { gx: 0, gy: 0 };
        if (k < used.length) used[k] = true;
        n.gridX = s.gx; n.gridY = s.gy;
      });

      list.forEach(n => {
        n.hasGridCoords = true;
        const px = gridToPixel(n.gridX, n.gridY);
        n.x = px.x; n.y = px.y; n.fx = px.x; n.fy = px.y;
      });
    });
  }

  // Light dashed cell boundaries, drawn behind everything else.
  function drawCells() {
    if (!cellsActive() || !gridScale) return;
    const cells = currentCells();
    const origin = gridToPixel(0, 0);

    ctx.save();
    ctx.lineWidth = 1.25 / zoomLevel;
    ctx.strokeStyle = 'rgba(0,0,0,0.22)';
    ctx.setLineDash([7 / zoomLevel, 5 / zoomLevel]);
    cells.forEach(cell => {
      if (cell.kind === 'rect') {
        const a = gridToPixel(cell.x0, cell.y1), b = gridToPixel(cell.x1, cell.y0);
        ctx.strokeRect(a.x, a.y, b.x - a.x, b.y - a.y);
      } else {
        ctx.beginPath();
        ctx.arc(origin.x, origin.y, cell.rOuter * gridScale, 0, Math.PI * 2);
        ctx.stroke();
      }
    });
    ctx.setLineDash([]);
    ctx.restore();
  }

  // Cell titles are drawn in a separate pass at the very end of render() so
  // they always sit above nodes, connection lines and every label. They use
  // the same rounded background box as node labels.
  function drawCellTitles() {
    if (!cellsActive() || !gridScale) return;
    const cells = currentCells();
    const titleSize = Number(formattingSettings.cellTitleSize) || 16;

    ctx.save();
    ctx.font = '600 ' + (titleSize / zoomLevel) + 'px Rubik, Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const pad = CONFIG.labelBoxPadding / zoomLevel;
    const boxH = (titleSize + 6) / zoomLevel;

    cells.forEach((cell, i) => {
      const t = cellTitle(i);
      if (!t) return;
      const boxW = ctx.measureText(t).width + pad * 2;
      let cx, boxTop;
      if (cell.kind === 'rect') {
        const p = gridToPixel((cell.x0 + cell.x1) / 2, cell.y1);
        cx = p.x; boxTop = p.y + 6 / zoomLevel;          // just inside the top edge
      } else {
        const p = gridToPixel(0, cell.rOuter);
        cx = p.x; boxTop = p.y - 5 / zoomLevel - boxH;   // sits on top of the ring
      }

      ctx.save();
      ctx.globalAlpha = CONFIG.labelBoxOpacity;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      roundRectPath(cx - boxW / 2, boxTop, boxW, boxH, 6 / zoomLevel);
      ctx.fill();
      ctx.restore();

      ctx.fillStyle = '#111827';
      ctx.fillText(t, cx, boxTop + boxH / 2);
    });
    ctx.restore();
  }

  // Small numbered diagram for the options menu.
  function cellPreviewSVG() {
    const cells = currentCells();
    const parts = [];
    cells.forEach((c, i) => {
      if (c.kind === 'rect') {
        parts.push('<rect x="' + c.x0 + '" y="' + (-c.y1) + '" width="' + (c.x1 - c.x0) +
          '" height="' + (c.y1 - c.y0) + '" fill="#FCFCFC" stroke="#9CA3AF" stroke-width="0.4" stroke-dasharray="1.8 1.3"/>');
        parts.push('<text x="' + ((c.x0 + c.x1) / 2) + '" y="' + (-(c.y0 + c.y1) / 2) +
          '" font-size="6" text-anchor="middle" dominant-baseline="central" fill="#111827">' + (i + 1) + '</text>');
      } else {
        const band = c.rOuter - c.rInner;
        const fsz = Math.min(6, Math.max(2.6, band * 0.7));
        parts.push('<circle cx="0" cy="0" r="' + c.rOuter + '" fill="none" stroke="#9CA3AF" stroke-width="0.4" stroke-dasharray="1.8 1.3"/>');
        parts.push('<text x="0" y="' + (-(c.rInner + c.rOuter) / 2) + '" font-size="' + fsz +
          '" text-anchor="middle" dominant-baseline="central" fill="#111827">' + (i + 1) + '</text>');
      }
    });
    return '<svg viewBox="-31 -31 62 62" font-family="Rubik, Arial, sans-serif" ' +
      'style="width:100%;max-width:208px;display:block;margin:2px auto 0;background:#fff;' +
      'border:1px solid var(--light-grey);border-radius:6px;">' + parts.join('') + '</svg>';
  }

  /************************************************************************
   * PHYSICS: STRUCTURAL CACHE
   * Hop distances and neighbourhood similarity are expensive, so they are
   * derived once per *connection set* and reused by every restart. Moving a
   * strength slider re-runs the simulation against this cache and never
   * recomputes it. The build is time-sliced on the main thread: the
   * force-directed and collision components start immediately, and the
